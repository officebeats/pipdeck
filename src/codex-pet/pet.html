<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pip: Codex Mascot Pet</title>
  <style>
    :root {
      --bg: #000000;
      --omp-pink: #ff3366;
      --omp-purple: #9333ea;
      --omp-cyan: #00f0ff;
      --omp-yellow: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      background: transparent !important;
      font-family: 'Fira Code', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: drag;
    }

    /* Micro-Compact Slender Mascot Arena (33% Thinner + 25% Shrunk) */
    .pet-container {
      width: 42px;
      height: 63px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1px;
      -webkit-app-region: no-drag;
    }

    .pet-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: transform 0.08s steps(2);
      filter: drop-shadow(0 2px 8px rgba(147, 51, 234, 0.35));
    }
    .pet-img:active {
      transform: scale(0.92);
    }

    /* Speech Bubble */
    .bubble {
      position: absolute;
      top: -3px;
      background: #000000;
      border: 1px solid var(--omp-cyan);
      color: var(--omp-cyan);
      font-size: 7px;
      font-weight: 800;
      padding: 1.5px 3.5px;
      border-radius: 2.5px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.12s steps(3);
      white-space: nowrap;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 30;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.9);
    }
    .bubble.show {
      top: -15px;
      opacity: 1;
    }

    /* Floating Heart on Pet */
    .heart {
      color: #f43f5e;
      font-size: 9px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 0.6s steps(4) forwards;
      z-index: 40;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { opacity: 1; transform: translateY(-16px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-32px) scale(0.9); }
    }

    /* Floating Token Crumb on Feed */
    .crumb {
      position: absolute;
      color: #facc15;
      font-family: monospace;
      font-size: 7px;
      font-weight: bold;
      pointer-events: none;
      animation: dropBite 0.5s steps(4) forwards;
      z-index: 40;
    }
    @keyframes dropBite {
      0% { opacity: 1; transform: translateY(-14px); }
      100% { opacity: 0; transform: translateY(14px) scale(0.4); }
    }
  </style>
</head>
<body>

  <div class="pet-container" id="petBox" title="Click: Pet Pip | Double-Click / F: Feed | Codex Live Sync">
    <div class="bubble" id="petBubble">Pip: Codex Ready ⚡</div>
    <img id="mascot" class="pet-img" src="/assets/animations/pip-idle.svg" alt="Pip Mascot">
  </div>

  <script>
    let sound = true;
    const states = {
      idle: '/assets/animations/pip-idle.svg',
      thinking: '/assets/animations/pip-thinking.svg',
      bash: '/assets/animations/pip-hacking.svg',
      alert: '/assets/animations/pip-alert.svg',
      victory: '/assets/animations/pip-victory.svg',
      swarm32: '/assets/animations/pip-swarm-32.svg',
      swarm: '/assets/animations/pip-swarm.svg',
    };

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type = 'square', dur = 0.08, gainVal = 0.04) {
      if (!sound) return;
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function sfxPurr() {
      playTone(260, 'square', 0.06, 0.04);
      setTimeout(() => playTone(390, 'square', 0.08, 0.05), 40);
    }

    function sfxFeed() {
      playTone(600, 'square', 0.04, 0.05);
      setTimeout(() => playTone(900, 'square', 0.06, 0.06), 40);
    }

    const mascot = document.getElementById('mascot');
    const petBox = document.getElementById('petBox');
    const petBubble = document.getElementById('petBubble');
    let bubbleTimer = null;

    function showBubble(text, duration = 3000) {
      if (!text) return;
      petBubble.textContent = text;
      petBubble.classList.add('show');
      if (bubbleTimer) clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => {
        petBubble.classList.remove('show');
      }, duration);
    }

    function spawnHeart(x, y) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '♥';
      h.style.left = `${x || 18}px`;
      h.style.top = `${y || 14}px`;
      petBox.appendChild(h);
      setTimeout(() => h.remove(), 600);
    }

    function spawnCrumb(x, y) {
      const c = document.createElement('div');
      c.className = 'crumb';
      c.textContent = '01';
      c.style.left = `${x || 18}px`;
      c.style.top = `${y || 15}px`;
      petBox.appendChild(c);
      setTimeout(() => c.remove(), 500);
    }

    function petPip(e) {
      sfxPurr();
      const rect = petBox.getBoundingClientRect();
      const x = e ? e.clientX - rect.left - 4 : rect.width / 2;
      const y = e ? e.clientY - rect.top - 10 : rect.height / 2 - 10;
      spawnHeart(x, y);

      fetch('/api/codex/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'pet' })
      }).catch(() => {});
    }

    function feedPip() {
      sfxFeed();
      const rect = petBox.getBoundingClientRect();
      spawnCrumb(rect.width / 2 - 6, rect.height / 2);

      fetch('/api/codex/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'feed' })
      }).catch(() => {});
    }

    petBox.addEventListener('click', (e) => petPip(e));
    petBox.addEventListener('dblclick', (e) => { e.preventDefault(); feedPip(); });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') feedPip();
      if (e.key === 'p' || e.key === 'P') petPip();
      if (e.key === 'm' || e.key === 'M') sound = !sound;
    });

    // Real-Time SSE Stream Hook for Codex / OMP Session Processing
    function connectEvents() {
      try {
        const es = new EventSource('/api/codex/events');
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.state && states[data.state]) {
              mascot.src = states[data.state];
            }
            if (data.command) {
              showBubble(data.command, 2500);
            }
          } catch (err) {}
        };
        es.onerror = () => {
          es.close();
          setTimeout(connectEvents, 1500);
        };
      } catch (e) {
        setTimeout(connectEvents, 2000);
      }
    }
    connectEvents();
  </script>
</body>
</html>
