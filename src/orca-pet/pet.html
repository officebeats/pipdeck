<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pip: Orca Mascot Pet</title>
  <style>
    :root {
      --bg: #000000;
      --border-green: #00ff41;
      --text: #ffffff;
      --omp-pink: #ff4071;
      --omp-purple: #9333ea;
      --omp-cyan: #00f0ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: rgba(0, 0, 0, 0);
      color: var(--text);
      font-family: 'Fira Code', monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    .pet-container {
      width: 140px;
      height: 140px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pet-svg-wrapper {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      transition: transform 0.15s ease;
    }
    .pet-container:hover .pet-svg-wrapper {
      transform: scale(1.06);
    }
    .pet-container:active .pet-svg-wrapper {
      transform: scale(0.95);
    }

    .bubble {
      position: absolute;
      top: -10px;
      background: #000000;
      border: 1.5px solid var(--omp-cyan);
      color: var(--omp-cyan);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      white-space: nowrap;
      z-index: 10;
    }
    .bubble.show {
      top: -24px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="pet-container" id="petBox" onclick="interactPet()">
    <div class="bubble" id="petBubble">Pip is Ready! ⚡</div>
    <div class="pet-svg-wrapper" id="petSvgBox">
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="40 50 84 80" shape-rendering="crispEdges">
        <defs>
          <pattern id="piHalftone" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="#180b2c"/>
            <rect x="0" y="0" width="2" height="2" fill="#c084fc"/>
            <rect x="2" y="2" width="2" height="2" fill="#c084fc"/>
          </pattern>
        </defs>
        <style>
          @keyframes pixelBreathe { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
          .mascot { animation: pixelBreathe 2.4s steps(2) infinite; transform-origin: 80px 100px; filter: drop-shadow(0 0 6px #9333ea); }
          .shadow { transform-origin: 80px 123px; animation: pixelBreathe 2.4s steps(2) infinite reverse; }
        </style>
        <ellipse cx="80" cy="123" rx="22" ry="2" fill="#9333ea" opacity="0.4" class="shadow"/>
        <ellipse cx="80" cy="123" rx="12" ry="1.2" fill="#00f0ff" opacity="0.7" class="shadow"/>
        
        <g class="mascot">
          <!-- Left Hook -->
          <rect x="51" y="60" width="4" height="4" fill="#ff4071"/>
          <rect x="51" y="65" width="4" height="4" fill="#ff4071"/>
          <rect x="51" y="70" width="4" height="4" fill="#ff4071"/>
          
          <!-- Crossbar Row 1 ($y=65$) -->
          <rect x="56" y="65" width="4" height="4" fill="#ff4071"/>
          <rect x="61" y="65" width="4" height="4" fill="#f43f5e"/>
          <rect x="66" y="65" width="4" height="4" fill="#f43f5e"/>
          <rect x="71" y="65" width="4" height="4" fill="#ec4899"/>
          <rect x="76" y="65" width="4" height="4" fill="#c026d3"/>
          <rect x="81" y="65" width="4" height="4" fill="#a855f7"/>
          <rect x="86" y="65" width="4" height="4" fill="#9333ea"/>
          <rect x="91" y="65" width="4" height="4" fill="#7c3aed"/>
          <rect x="96" y="65" width="4" height="4" fill="#3b82f6"/>
          <rect x="101" y="65" width="4" height="4" fill="#0ea5e9"/>
          <rect x="106" y="65" width="4" height="4" fill="#00f0ff"/>
          <rect x="106" y="70" width="4" height="4" fill="#00f0ff"/>

          <!-- Crossbar Row 2 ($y=70$) -->
          <rect x="56" y="70" width="4" height="4" fill="#ff4071"/>
          <rect x="61" y="70" width="4" height="4" fill="#f43f5e"/>
          <rect x="66" y="70" width="4" height="4" fill="#f43f5e"/>
          <rect x="71" y="70" width="4" height="4" fill="#ec4899"/>
          <rect x="76" y="70" width="4" height="4" fill="#c026d3"/>
          <rect x="81" y="70" width="4" height="4" fill="#a855f7"/>
          <rect x="86" y="70" width="4" height="4" fill="#9333ea"/>
          <rect x="91" y="70" width="4" height="4" fill="#7c3aed"/>
          <rect x="96" y="70" width="4" height="4" fill="#3b82f6"/>
          <rect x="101" y="70" width="4" height="4" fill="#0ea5e9"/>

          <!-- Crossbar Row 3 ($y=75$) -->
          <rect x="56" y="75" width="4" height="4" fill="#f43f5e"/>
          <rect x="71" y="75" width="4" height="4" fill="#ec4899"/>
          <rect x="76" y="75" width="4" height="4" fill="#c026d3"/>
          <rect x="81" y="75" width="4" height="4" fill="#a855f7"/>
          <rect x="86" y="75" width="4" height="4" fill="#9333ea"/>
          <rect x="101" y="75" width="4" height="4" fill="#00f0ff"/>

          <!-- Left Leg -->
          <rect x="61" y="75" width="4" height="4" fill="#f43f5e"/>
          <rect x="66" y="75" width="4" height="4" fill="#f43f5e"/>
          <rect x="61" y="80" width="4" height="4" fill="#ec4899"/>
          <rect x="66" y="80" width="4" height="4" fill="#ec4899"/>
          <rect x="61" y="85" width="4" height="4" fill="#ec4899"/>
          <rect x="66" y="85" width="4" height="4" fill="#ec4899"/>
          <rect x="61" y="90" width="4" height="4" fill="#d946ef"/>
          <rect x="66" y="90" width="4" height="4" fill="#d946ef"/>
          <rect x="61" y="95" width="4" height="4" fill="#c026d3"/>
          <rect x="66" y="95" width="4" height="4" fill="#c026d3"/>
          <rect x="61" y="100" width="4" height="4" fill="#a855f7"/>
          <rect x="66" y="100" width="4" height="4" fill="#a855f7"/>
          <rect x="61" y="105" width="4" height="4" fill="#9333ea"/>
          <rect x="66" y="105" width="4" height="4" fill="#9333ea"/>
          <rect x="61" y="110" width="4" height="4" fill="#7e22ce"/>
          <rect x="66" y="110" width="4" height="4" fill="#7e22ce"/>
          <rect x="61" y="115" width="4" height="4" fill="#581c87"/>
          <rect x="66" y="115" width="4" height="4" fill="#581c87"/>
          <rect x="56" y="120" width="4" height="4" fill="#701a75"/>
          <rect x="61" y="120" width="4" height="4" fill="#581c87"/>
          <rect x="66" y="120" width="4" height="4" fill="#581c87"/>
          <rect x="71" y="120" width="4" height="4" fill="#701a75"/>
          <rect x="56" y="125" width="4" height="4" fill="#3b0764"/>
          <rect x="61" y="125" width="4" height="4" fill="#c084fc"/>
          <rect x="66" y="125" width="4" height="4" fill="#3b0764"/>
          <rect x="71" y="125" width="4" height="4" fill="#c084fc"/>

          <!-- Right Leg -->
          <rect x="91" y="75" width="4" height="4" fill="#7c3aed"/>
          <rect x="96" y="75" width="4" height="4" fill="#7c3aed"/>
          <rect x="91" y="80" width="4" height="4" fill="#3b82f6"/>
          <rect x="96" y="80" width="4" height="4" fill="#3b82f6"/>
          <rect x="91" y="85" width="4" height="4" fill="#2563eb"/>
          <rect x="96" y="85" width="4" height="4" fill="#2563eb"/>
          <rect x="91" y="90" width="4" height="4" fill="#1d4ed8"/>
          <rect x="96" y="90" width="4" height="4" fill="#1d4ed8"/>
          <rect x="91" y="95" width="4" height="4" fill="#0284c7"/>
          <rect x="96" y="95" width="4" height="4" fill="#0284c7"/>
          <rect x="91" y="100" width="4" height="4" fill="#0ea5e9"/>
          <rect x="96" y="100" width="4" height="4" fill="#0ea5e9"/>
          <rect x="91" y="105" width="4" height="4" fill="#06b6d4"/>
          <rect x="96" y="105" width="4" height="4" fill="#06b6d4"/>
          <rect x="91" y="110" width="4" height="4" fill="#06b6d4"/>
          <rect x="96" y="110" width="4" height="4" fill="#00f0ff"/>
          <rect x="101" y="110" width="4" height="4" fill="#00f0ff"/>
          <rect x="96" y="115" width="4" height="4" fill="#00f0ff"/>
          <rect x="101" y="115" width="4" height="4" fill="#00f0ff"/>
          <rect x="106" y="115" width="4" height="4" fill="#00f0ff"/>
          <rect x="106" y="110" width="4" height="4" fill="#00f0ff"/>
        </g>
      </svg>
    </div>
  </div>

  <script>
    const phrases = [
      "Pip: OMP Active 🚀",
      "Swarm: 32 Nodes! ⚡",
      "Coding with Claude & Gemini ✨",
      "Pip Loves Oh My Pi!"
    ];

    function interactPet() {
      const bubble = document.getElementById('petBubble');
      const text = phrases[Math.floor(Math.random() * phrases.length)];
      bubble.innerText = text;
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 2400);
    }
  </script>
</body>
</html>
