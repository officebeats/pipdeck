<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pip: Orca Mascot Pet</title>
  <style>
    :root {
      --bg: #000000;
      --border-green: #00ff41;
      --text: #ffffff;
      --omp-pink: #ff4071;
      --omp-purple: #9333ea;
      --omp-cyan: #00f0ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: rgba(0, 0, 0, 0);
      color: var(--text);
      font-family: 'Fira Code', monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    .pet-container {
      width: 130px;
      height: 140px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pet-svg-wrapper {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      transition: transform 0.15s ease;
    }
    .pet-container:hover .pet-svg-wrapper {
      transform: scale(1.08);
    }
    .pet-container:active .pet-svg-wrapper {
      transform: scale(0.95);
    }

    /* Floating Bubble */
    .bubble {
      position: absolute;
      top: -10px;
      background: #000000;
      border: 1.5px solid var(--omp-cyan);
      color: var(--omp-cyan);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      white-space: nowrap;
      z-index: 10;
    }
    .bubble.show {
      top: -24px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="pet-container" id="petBox" onclick="interactPet()">
    <div class="bubble" id="petBubble">Pip is Ready! ⚡</div>
    <div class="pet-svg-wrapper" id="petSvgBox">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="40 60 80 80" width="100%" height="100%" shape-rendering="crispEdges">
        <defs>
          <pattern id="piHalftone" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
            <rect width="3" height="3" fill="#180b2c"/>
            <rect x="0" y="0" width="1" height="1" fill="#c084fc"/>
            <rect x="2" y="2" width="1" height="1" fill="#c084fc"/>
          </pattern>
        </defs>
        <style>
          @keyframes pixelBreathe { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
          @keyframes pixelBlink { 0%, 42%, 58%, 100% { opacity: 1; } 45%, 55% { opacity: 0; } }
          @keyframes pixelBlinkClosed { 0%, 42%, 58%, 100% { opacity: 0; } 45%, 55% { opacity: 1; } }
          .mascot { animation: pixelBreathe 2.4s steps(2) infinite; transform-origin: 80px 100px; filter: drop-shadow(0 0 4px #9333ea); }
          .shadow { transform-origin: 80px 124px; animation: pixelBreathe 2.4s steps(2) infinite reverse; }
          .eye-open { animation: pixelBlink 4s steps(1) infinite; }
          .eye-closed { animation: pixelBlinkClosed 4s steps(1) infinite; }
        </style>
        <ellipse cx="80" cy="124" rx="22" ry="3.5" fill="#9333ea" opacity="0.35" class="shadow"/>
        <ellipse cx="80" cy="124" rx="12" ry="2" fill="#00f0ff" opacity="0.5" class="shadow"/>
        <g class="mascot">
          <rect x="49" y="74" width="9" height="9" fill="#ff4071" stroke="#000" stroke-width="0.75"/>
          <rect x="58" y="74" width="9" height="9" fill="#f43f5e" stroke="#000" stroke-width="0.75"/>
          <rect x="67" y="74" width="9" height="9" fill="#c026d3" stroke="#000" stroke-width="0.75"/>
          <rect x="76" y="74" width="9" height="9" fill="#9333ea" stroke="#000" stroke-width="0.75"/>
          <rect x="85" y="74" width="9" height="9" fill="#6366f1" stroke="#000" stroke-width="0.75"/>
          <rect x="94" y="74" width="9" height="9" fill="#0ea5e9" stroke="#000" stroke-width="0.75"/>
          <rect x="103" y="74" width="9" height="9" fill="#00f0ff" stroke="#000" stroke-width="0.75"/>

          <rect x="58" y="83" width="9" height="9" fill="#ec4899" stroke="#000" stroke-width="0.75"/>
          <rect x="58" y="92" width="9" height="9" fill="#a855f7" stroke="#000" stroke-width="0.75"/>
          <rect x="58" y="101" width="9" height="9" fill="#7e22ce" stroke="#000" stroke-width="0.75"/>
          <rect x="58" y="110" width="9" height="9" fill="url(#piHalftone)" stroke="#000" stroke-width="0.75"/>

          <rect x="85" y="83" width="9" height="9" fill="#7c3aed" stroke="#000" stroke-width="0.75"/>
          <rect x="85" y="92" width="9" height="9" fill="#2563eb" stroke="#000" stroke-width="0.75"/>
          <rect x="85" y="101" width="9" height="9" fill="#0284c7" stroke="#000" stroke-width="0.75"/>
          <rect x="85" y="110" width="9" height="9" fill="#00f0ff" stroke="#000" stroke-width="0.75"/>

          <g class="eye-closed">
            <rect x="71" y="78" width="4" height="2" fill="#ffffff"/>
            <rect x="88" y="78" width="4" height="2" fill="#ffffff"/>
          </g>
          <g class="eye-open">
            <rect x="71" y="76" width="4" height="4" fill="#ffffff"/>
            <rect x="72" y="77" width="2" height="2" fill="#000000"/>
            <rect x="88" y="76" width="4" height="4" fill="#ffffff"/>
            <rect x="89" y="77" width="2" height="2" fill="#000000"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <script>
    const phrases = [
      "Pip: OMP Active 🚀",
      "Swarm: 32 Nodes! ⚡",
      "Coding with Claude & Gemini ✨",
      "Purring in 8-bit 💚",
      "Pip Loves Oh My Pi!"
    ];

    function interactPet() {
      const bubble = document.getElementById('petBubble');
      const text = phrases[Math.floor(Math.random() * phrases.length)];
      bubble.innerText = text;
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 2400);
    }
  </script>
</body>
</html>
