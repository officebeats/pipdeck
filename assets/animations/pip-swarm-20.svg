<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    @keyframes ringCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes ringCCW { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes levitate { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
    .r-in { animation: ringCW 8s linear infinite; transform-origin: 80px 100px; }
    .r-mid { animation: ringCCW 13s linear infinite; transform-origin: 80px 100px; }
    .r-out { animation: ringCW 18s linear infinite; transform-origin: 80px 100px; }
    .pip-mascot { animation: levitate 1.8s ease-in-out infinite; transform-origin: 80px 100px; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid & Reticles -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="25" x2="160" y2="25"/><line x1="0" y1="50" x2="160" y2="50"/><line x1="0" y1="150" x2="160" y2="150"/><line x1="0" y1="175" x2="160" y2="175"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/><path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="138" rx="24" ry="4" fill="#00ff41" opacity="0.3"/>

  <!-- Outer Ring 3 (8 Nodes - R=68px) -->
  <g class="r-out">
    <circle cx="80" cy="100" r="68" fill="none" stroke="#14532d" stroke-width="1" stroke-dasharray="2,4" opacity="0.6"/>
    <!-- 8 Nodes every 45 deg -->
    <g transform="translate(142, 94)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#38bdf8"/></g>
    <g transform="translate(122, 142)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(74, 162)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(26, 142)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00ff41"/></g>
    <g transform="translate(6, 94)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(26, 46)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#facc15"/></g>
    <g transform="translate(74, 26)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#38bdf8"/></g>
    <g transform="translate(122, 46)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fb923c"/></g>
  </g>

  <!-- Mid Ring 2 (7 Nodes - R=52px) -->
  <g class="r-mid">
    <circle cx="80" cy="100" r="52" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>
    <g transform="translate(127, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#38bdf8"/></g>
    <g transform="translate(112, 134)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(70, 147)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(34, 122)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00ff41"/></g>
    <g transform="translate(34, 78)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(70, 53)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#facc15"/></g>
    <g transform="translate(112, 66)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#38bdf8"/></g>
  </g>

  <!-- Inner Ring 1 (5 Nodes - R=36px) -->
  <g class="r-in">
    <circle cx="80" cy="100" r="36" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="2,2" opacity="0.85"/>
    <g transform="translate(111, 96)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#38bdf8"/></g>
    <g transform="translate(86, 129)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(48, 116)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#00ff41"/></g>
    <g transform="translate(48, 76)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(86, 63)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#facc15"/></g>
  </g>

  <!-- Standardized Large Pip Mascot -->
  <g class="pip-mascot">
    <rect x="56" y="74" width="48" height="12" fill="#00ff41"/><rect x="60" y="72" width="40" height="16" fill="#00ff41"/><rect x="52" y="76" width="56" height="8" fill="#00ff41"/>
    <rect x="62" y="86" width="14" height="28" fill="#00ff41"/><rect x="60" y="112" width="18" height="8" fill="#00ff41"/>
    <rect x="84" y="86" width="14" height="26" fill="#00ff41"/><rect x="84" y="110" width="20" height="10" fill="#00ff41"/><rect x="98" y="104" width="8" height="12" fill="#00ff41"/>
    <rect x="64" y="88" width="10" height="24" fill="#000000"/><rect x="66" y="88" width="7" height="24" fill="#00ff41"/><rect x="66" y="88" width="2" height="24" fill="#ffffff"/>
    <rect x="62" y="114" width="14" height="4" fill="#000000"/><rect x="64" y="114" width="10" height="3" fill="#00ff41"/>
    <rect x="86" y="88" width="10" height="22" fill="#000000"/><rect x="88" y="88" width="7" height="22" fill="#00ff41"/><rect x="88" y="88" width="2" height="22" fill="#ffffff"/>
    <rect x="86" y="112" width="16" height="6" fill="#000000"/><rect x="88" y="112" width="13" height="4" fill="#00ff41"/><rect x="100" y="106" width="4" height="8" fill="#000000"/><rect x="101" y="107" width="3" height="5" fill="#00ff41"/>
    <rect x="58" y="74" width="44" height="12" fill="#000000"/><rect x="60" y="74" width="40" height="12" fill="#00ff41"/><rect x="60" y="72" width="40" height="2" fill="#ffffff"/><rect x="58" y="85" width="44" height="1" fill="#000000"/>
    <rect x="62" y="76" width="36" height="8" fill="#000000"/>
    <g fill="#00ff41"><rect x="68" y="77" width="6" height="4"/><rect x="72" y="77" width="2" height="4" fill="#ffffff"/><rect x="86" y="77" width="6" height="4"/><rect x="86" y="77" width="2" height="4" fill="#ffffff"/></g>
  </g>

  <!-- Status Tag -->
  <g transform="translate(98, 6)">
    <rect width="58" height="15" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="29" y="11" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">20 NODES</text>
  </g>
</svg>
