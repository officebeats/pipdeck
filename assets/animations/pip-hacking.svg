    <rect x="102" y="69" width="4" height="4" fill="#06b6d4"/>
    <rect x="107" y="69" width="4" height="4" fill="#00f0ff"/>
    <rect x="112" y="69" width="4" height="4" fill="#00f0ff"/>
    <rect x="117" y="69" width="4" height="4" fill="#00f0ff"/>
    <rect x="117" y="74" width="4" height="4" fill="#00f0ff"/>

    <!-- Crossbar Row 2 ($y=74$) -->
    <rect x="47" y="74" width="4" height="4" fill="#ff4071"/>
    <rect x="52" y="74" width="4" height="4" fill="#f43f5e"/>
    <rect x="57" y="74" width="4" height="4" fill="#f43f5e"/>
    <rect x="62" y="74" width="4" height="4" fill="#ec4899"/>
    <rect x="67" y="74" width="4" height="4" fill="#c084fc"/>
    <rect x="72" y="74" width="4" height="4" fill="#a855f7"/>
    <rect x="77" y="74" width="4" height="4" fill="#9333ea"/>
    <rect x="82" y="74" width="4" height="4" fill="#7c3aed"/>
    <rect x="87" y="74" width="4" height="4" fill="#6366f1"/>
    <rect x="92" y="74" width="4" height="4" fill="#3b82f6"/>
    <rect x="97" y="74" width="4" height="4" fill="#0ea5e9"/>
    <rect x="102" y="74" width="4" height="4" fill="#06b6d4"/>
    <rect x="107" y="74" width="4" height="4" fill="#00f0ff"/>
    <rect x="112" y="74" width="4" height="4" fill="#00f0ff"/>

    <!-- Left Leg -->
    <rect x="57" y="79" width="4" height="4" fill="#f43f5e"/>
    <rect x="62" y="79" width="4" height="4" fill="#f43f5e"/>
    <rect x="57" y="84" width="4" height="4" fill="#ec4899"/>
    <rect x="62" y="84" width="4" height="4" fill="#ec4899"/>
    <rect x="57" y="89" width="4" height="4" fill="#ec4899"/>
    <rect x="62" y="89" width="4" height="4" fill="#ec4899"/>
    <rect x="57" y="94" width="4" height="4" fill="#d946ef"/>
