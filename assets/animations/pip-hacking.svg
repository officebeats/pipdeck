<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <pattern id="piHalftone" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#180b2c"/>
      <rect x="0" y="0" width="2" height="2" fill="#c084fc"/>
      <rect x="2" y="2" width="2" height="2" fill="#c084fc"/>
    </pattern>
  </defs>

  <style>
    @keyframes matrixStream1 { 0% { transform: translateY(-10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(205px); opacity: 0; } }
    @keyframes matrixStream2 { 0% { transform: translateY(-10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(205px); opacity: 0; } }
    @keyframes typingHands { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }

    .stream-1 { animation: matrixStream1 2s steps(8) infinite; }
    .stream-2 { animation: matrixStream2 2.6s steps(8) infinite 0.8s; }
    .mascot-hacking { animation: typingHands 0.4s steps(2) infinite; transform-origin: 80px 100px; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">BASH</text>
  </g>

  <!-- Matrix Code Rain Streams -->
  <g class="stream-1" fill="#00ff41">
    <rect x="15" y="0" width="2" height="10"/><rect x="42" y="0" width="2" height="14"/><rect x="120" y="0" width="2" height="12"/><rect x="145" y="0" width="2" height="8"/>
  </g>
  <g class="stream-2" fill="#00f0ff">
    <rect x="28" y="0" width="2" height="16"/><rect x="75" y="0" width="2" height="8"/><rect x="135" y="0" width="2" height="14"/>
  </g>

  <!-- Terminal Keyboard Surface -->
  <g transform="translate(36, 150)">
    <rect width="88" height="24" fill="#0f0f0f" stroke="#9333ea" stroke-width="1.5"/>
    <line x1="10" y1="6" x2="78" y2="6" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="10" y1="12" x2="78" y2="12" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="10" y1="18" x2="78" y2="18" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Clean Floating Pi Mascot (Hacking) -->
  <g class="mascot-hacking">
    <!-- Left Hook -->
    <rect x="56" y="76" width="3" height="3" fill="#ff4071"/>
    <rect x="56" y="80" width="3" height="3" fill="#ff4071"/>
    <rect x="56" y="84" width="3" height="3" fill="#ff4071"/>
    
    <!-- Crossbar Row 1 ($y=80$) -->
    <rect x="60" y="80" width="3" height="3" fill="#ff4071"/>
    <rect x="64" y="80" width="3" height="3" fill="#f43f5e"/>
    <rect x="68" y="80" width="3" height="3" fill="#f43f5e"/>
    <rect x="72" y="80" width="3" height="3" fill="#ec4899"/>
    <rect x="76" y="80" width="3" height="3" fill="#c026d3"/>
    <rect x="80" y="80" width="3" height="3" fill="#a855f7"/>
    <rect x="84" y="80" width="3" height="3" fill="#9333ea"/>
    <rect x="88" y="80" width="3" height="3" fill="#7c3aed"/>
    <rect x="92" y="80" width="3" height="3" fill="#3b82f6"/>
    <rect x="96" y="80" width="3" height="3" fill="#0ea5e9"/>
    <rect x="100" y="80" width="3" height="3" fill="#00f0ff"/>
    <rect x="100" y="84" width="3" height="3" fill="#00f0ff"/>

    <!-- Crossbar Row 2 ($y=84$) -->
    <rect x="60" y="84" width="3" height="3" fill="#ff4071"/>
    <rect x="64" y="84" width="3" height="3" fill="#f43f5e"/>
    <rect x="68" y="84" width="3" height="3" fill="#f43f5e"/>
    <rect x="72" y="84" width="3" height="3" fill="#ec4899"/>
    <rect x="76" y="84" width="3" height="3" fill="#c026d3"/>
    <rect x="80" y="84" width="3" height="3" fill="#a855f7"/>
    <rect x="84" y="84" width="3" height="3" fill="#9333ea"/>
    <rect x="88" y="84" width="3" height="3" fill="#7c3aed"/>
    <rect x="92" y="84" width="3" height="3" fill="#3b82f6"/>
    <rect x="96" y="84" width="3" height="3" fill="#0ea5e9"/>

    <!-- Crossbar Row 3 ($y=88$) -->
    <rect x="60" y="88" width="3" height="3" fill="#f43f5e"/>
    <rect x="72" y="88" width="3" height="3" fill="#ec4899"/>
    <rect x="76" y="88" width="3" height="3" fill="#c026d3"/>
    <rect x="80" y="88" width="3" height="3" fill="#a855f7"/>
    <rect x="84" y="88" width="3" height="3" fill="#9333ea"/>
    <rect x="96" y="88" width="3" height="3" fill="#00f0ff"/>

    <!-- Left Leg -->
    <rect x="64" y="88" width="3" height="3" fill="#f43f5e"/>
    <rect x="68" y="88" width="3" height="3" fill="#f43f5e"/>
    <rect x="64" y="92" width="3" height="3" fill="#ec4899"/>
    <rect x="68" y="92" width="3" height="3" fill="#ec4899"/>
    <rect x="64" y="96" width="3" height="3" fill="#ec4899"/>
    <rect x="68" y="96" width="3" height="3" fill="#ec4899"/>
    <rect x="64" y="100" width="3" height="3" fill="#d946ef"/>
    <rect x="68" y="100" width="3" height="3" fill="#d946ef"/>
    <rect x="64" y="104" width="3" height="3" fill="#c026d3"/>
    <rect x="68" y="104" width="3" height="3" fill="#c026d3"/>
    <rect x="64" y="108" width="3" height="3" fill="#a855f7"/>
    <rect x="68" y="108" width="3" height="3" fill="#a855f7"/>
    <rect x="64" y="112" width="3" height="3" fill="#9333ea"/>
    <rect x="68" y="112" width="3" height="3" fill="#9333ea"/>
    <rect x="64" y="116" width="3" height="3" fill="#7e22ce"/>
    <rect x="68" y="116" width="3" height="3" fill="#7e22ce"/>
    <!-- Left Foot Base + Halftone -->
    <rect x="60" y="120" width="3" height="3" fill="#701a75"/>
    <rect x="64" y="120" width="3" height="3" fill="#581c87"/>
    <rect x="68" y="120" width="3" height="3" fill="#581c87"/>
    <rect x="72" y="120" width="3" height="3" fill="#701a75"/>
    <rect x="60" y="124" width="3" height="3" fill="#3b0764"/>
    <rect x="64" y="124" width="3" height="3" fill="#c084fc"/>
    <rect x="68" y="124" width="3" height="3" fill="#3b0764"/>
    <rect x="72" y="124" width="3" height="3" fill="#c084fc"/>

    <!-- Right Leg -->
    <rect x="88" y="88" width="3" height="3" fill="#7c3aed"/>
    <rect x="92" y="88" width="3" height="3" fill="#7c3aed"/>
    <rect x="88" y="92" width="3" height="3" fill="#3b82f6"/>
    <rect x="92" y="92" width="3" height="3" fill="#3b82f6"/>
    <rect x="88" y="96" width="3" height="3" fill="#2563eb"/>
    <rect x="92" y="96" width="3" height="3" fill="#2563eb"/>
    <rect x="88" y="100" width="3" height="3" fill="#1d4ed8"/>
    <rect x="92" y="100" width="3" height="3" fill="#1d4ed8"/>
    <rect x="88" y="104" width="3" height="3" fill="#0284c7"/>
    <rect x="92" y="104" width="3" height="3" fill="#0284c7"/>
    <rect x="88" y="108" width="3" height="3" fill="#0ea5e9"/>
    <rect x="92" y="108" width="3" height="3" fill="#0ea5e9"/>
    <rect x="88" y="112" width="3" height="3" fill="#06b6d4"/>
    <rect x="92" y="112" width="3" height="3" fill="#06b6d4"/>
    <!-- Curving Outward into Tail Foot -->
    <rect x="88" y="116" width="3" height="3" fill="#06b6d4"/>
    <rect x="92" y="116" width="3" height="3" fill="#00f0ff"/>
    <rect x="96" y="116" width="3" height="3" fill="#00f0ff"/>
    <!-- Upswept Tail Foot -->
    <rect x="92" y="120" width="3" height="3" fill="#00f0ff"/>
    <rect x="96" y="120" width="3" height="3" fill="#00f0ff"/>
    <rect x="100" y="120" width="3" height="3" fill="#00f0ff"/>
    <rect x="100" y="116" width="3" height="3" fill="#00f0ff"/>

    <!-- Typing Hands -->
    <rect x="52" y="128" width="6" height="6" fill="#ff4071"/>
    <rect x="102" y="128" width="6" height="6" fill="#00f0ff"/>
  </g>
</svg>
