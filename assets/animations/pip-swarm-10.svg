<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    @keyframes vortexRing1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes vortexRing2 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes levitateCenter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .ring-1 { animation: vortexRing1 8s steps(8) infinite; transform-origin: 80px 100px; }
    .ring-2 { animation: vortexRing2 14s steps(12) infinite; transform-origin: 80px 100px; }
    .pip-commander { animation: levitateCenter 1.8s steps(2) infinite; transform-origin: 80px 100px; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">10x DUAL</text>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#7443fa" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#7443fa" opacity="0.25"/>

  <!-- Ring 2: Outer 6 Nodes -->
  <g class="ring-2">
    <circle cx="80" cy="100" r="65" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="3,5" opacity="0.7"/>
    <g transform="translate(139, 94)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#22d3ee"/></g>
    <g transform="translate(107, 149)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(42, 149)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(10, 94)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(42, 40)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fbbf24"/></g>
    <g transform="translate(107, 40)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00ff41"/></g>
  </g>

  <!-- Ring 1: Inner 4 Nodes -->
  <g class="ring-1">
    <circle cx="80" cy="100" r="40" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="2,4" opacity="0.9"/>
    <g transform="translate(115, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#22d3ee"/></g>
    <g transform="translate(75, 135)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(35, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(75, 55)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#fbbf24"/></g>
  </g>

  <!-- Mascot Body (OMP Palette) -->
  <g class="pip-commander">
    <rect x="64" y="84" width="32" height="10" fill="#7443fa"/><rect x="66" y="82" width="28" height="14" fill="#7443fa"/><rect x="62" y="86" width="36" height="6" fill="#7443fa"/>
    <rect x="68" y="94" width="10" height="22" fill="#6437e3"/><rect x="66" y="114" width="14" height="6" fill="#7443fa"/>
    <rect x="82" y="94" width="10" height="20" fill="#6437e3"/><rect x="82" y="112" width="16" height="8" fill="#7443fa"/>
    <rect x="94" y="106" width="6" height="10" fill="#8b5cf6"/>
    <rect x="70" y="96" width="6" height="18" fill="#000000"/><rect x="71" y="96" width="5" height="18" fill="#7443fa"/><rect x="71" y="96" width="2" height="18" fill="#ffffff"/>
    <rect x="84" y="96" width="6" height="16" fill="#000000"/><rect x="85" y="96" width="5" height="16" fill="#7443fa"/><rect x="85" y="96" width="2" height="16" fill="#ffffff"/>
    <rect x="66" y="84" width="28" height="10" fill="#0f0f0f"/><rect x="67" y="84" width="26" height="10" fill="#7443fa"/><rect x="67" y="82" width="26" height="2" fill="#ffffff"/>
    <rect x="69" y="85" width="22" height="7" fill="#0f0f0f"/>
    <rect x="72" y="86" width="5" height="4" fill="#22d3ee"/><rect x="73" y="86" width="2.5" height="2.5" fill="#ffffff"/>
    <rect x="83" y="86" width="5" height="4" fill="#22d3ee"/><rect x="84" y="86" width="2.5" height="2.5" fill="#ffffff"/>
    <g fill="#7443fa"><rect x="58" y="86" width="4" height="6"/><rect x="59" y="87" width="2" height="4" fill="#22d3ee"/><rect x="98" y="86" width="4" height="6"/><rect x="99" y="87" width="2" height="4" fill="#22d3ee"/></g>
  </g>
</svg>
