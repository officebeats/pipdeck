  <g class="rain-stream-2" fill="#00f0ff" opacity="0.8"><rect x="22" y="0" width="1" height="14"/><rect x="80" y="0" width="1" height="6"/><rect x="138" y="0" width="1" height="14"/></g>

  <!-- Telepathic Waves -->
  <!-- Lightning Arcs -->
