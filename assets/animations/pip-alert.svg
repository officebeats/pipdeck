<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    @keyframes pixelJump {
      0%, 100% { transform: translateY(0px); }
      30% { transform: translateY(-8px); }
      50% { transform: translateY(0px); }
      70% { transform: translateY(-3px); }
    }
    @keyframes alertPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
    @keyframes beamFlash {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    .mascot-alert { animation: pixelJump 1.2s steps(4) infinite; transform-origin: 80px 100px; }
    .alert-badge { animation: alertPulse 0.6s steps(2) infinite; transform-origin: 80px 42px; }
    .alert-beam { animation: beamFlash 0.6s steps(2) infinite; }
  </style>

  <!-- Pure Black Background -->
  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="25" x2="160" y2="25"/>
    <line x1="0" y1="50" x2="160" y2="50"/>
    <line x1="0" y1="150" x2="160" y2="150"/>
    <line x1="0" y1="175" x2="160" y2="175"/>
    <line x1="25" y1="0" x2="25" y2="200"/>
    <line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/>
    <path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/>
    <path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Flashing Vertical Alert Beams -->
  <g class="alert-beam" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="80" y1="0" x2="80" y2="30"/>
    <line x1="40" y1="0" x2="40" y2="200" opacity="0.4"/>
    <line x1="120" y1="0" x2="120" y2="200" opacity="0.4"/>
  </g>

  <!-- Retro [!] Alert Badge Above Head (Y=32..54) -->
  <g class="alert-badge" transform="translate(68, 32)">
    <rect width="24" height="22" fill="#00ff41"/>
    <rect x="2" y="2" width="20" height="18" fill="#facc15"/>
    <rect x="9" y="4" width="6" height="8" fill="#000000"/>
    <rect x="9" y="14" width="6" height="4" fill="#000000"/>
  </g>

  <!-- Floor Shadow -->
  <ellipse cx="80" cy="144" rx="28" ry="5" fill="#facc15" opacity="0.3"/>

  <!-- Mascot Body (Centered at 80, 100) -->
  <g class="mascot-alert">
    <!-- Outlines -->
    <rect x="56" y="80" width="48" height="12" fill="#00ff41"/>
    <rect x="60" y="78" width="40" height="16" fill="#00ff41"/>
    <rect x="52" y="82" width="56" height="8" fill="#00ff41"/>

    <rect x="62" y="92" width="14" height="28" fill="#00ff41"/>
    <rect x="60" y="118" width="18" height="8" fill="#00ff41"/>

    <rect x="84" y="92" width="14" height="26" fill="#00ff41"/>
    <rect x="84" y="116" width="20" height="10" fill="#00ff41"/>
    <rect x="98" y="110" width="8" height="12" fill="#00ff41"/>

    <!-- Left Leg Black Separation & Solid Green Fill -->
    <rect x="64" y="94" width="10" height="24" fill="#000000"/>
    <rect x="66" y="94" width="7" height="24" fill="#a3e635"/>
    <rect x="66" y="94" width="2" height="24" fill="#facc15"/>
    <rect x="62" y="120" width="14" height="4" fill="#000000"/>
    <rect x="64" y="120" width="10" height="3" fill="#a3e635"/>

    <!-- Right Leg Black Separation & Solid Green Fill -->
    <rect x="86" y="94" width="10" height="22" fill="#000000"/>
    <rect x="88" y="94" width="7" height="22" fill="#a3e635"/>
    <rect x="88" y="94" width="2" height="22" fill="#facc15"/>
    <!-- Right Leg Signature Pi-Curl Kickstand -->
    <rect x="86" y="118" width="16" height="6" fill="#000000"/>
    <rect x="88" y="118" width="13" height="4" fill="#a3e635"/>
    <rect x="100" y="112" width="4" height="8" fill="#000000"/>
    <rect x="101" y="113" width="3" height="5" fill="#a3e635"/>

    <!-- Head / Crossbar Black Separation & Fill -->
    <rect x="58" y="80" width="44" height="12" fill="#000000"/>
    <rect x="60" y="80" width="40" height="12" fill="#a3e635"/>
    <rect x="60" y="78" width="40" height="2" fill="#facc15"/>
    <rect x="58" y="91" width="44" height="1" fill="#000000"/>

    <!-- OLED Visor -->
    <rect x="62" y="82" width="36" height="8" fill="#000000"/>

    <!-- Big Wide Inquisitive Eyes -->
    <g fill="#facc15">
      <rect x="66" y="82" width="8" height="6"/>
      <rect x="68" y="82" width="4" height="4" fill="#ffffff"/>

      <rect x="86" y="82" width="8" height="6"/>
      <rect x="88" y="82" width="4" height="4" fill="#ffffff"/>
    </g>

    <!-- Raised Questioning Hand -->
    <rect x="98" y="88" width="6" height="6" fill="#facc15"/>
    <rect x="100" y="88" width="2" height="2" fill="#ffffff"/>
  </g>
</svg>
