<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="piCrossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="85%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="piLeftLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#c026d3"/>
      <stop offset="85%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="piRightLegGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="piHalftone" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#2e1065"/>
      <rect x="0" y="0" width="1.2" height="1.2" fill="#c084fc"/>
      <rect x="1.5" y="1.5" width="1.2" height="1.2" fill="#e879f9"/>
    </pattern>
  </defs>

  <style>
    @keyframes alertStrobe { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes mascotTremble { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2px); } }

    .alert-flash { animation: alertStrobe 0.6s steps(2) infinite; }
    .mascot-alert { animation: mascotTremble 0.3s steps(2) infinite; transform-origin: 80px 100px; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#3b2b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#facc15" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#facc15" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#facc15" text-anchor="middle">ALERT</text>
  </g>

  <!-- Warning Triangle Banner -->
  <g class="alert-flash" transform="translate(68, 30)">
    <polygon points="12,0 24,22 0,22" fill="none" stroke="#facc15" stroke-width="2"/>
    <rect x="11" y="7" width="2" height="7" fill="#facc15"/>
    <rect x="11" y="17" width="2" height="2" fill="#facc15"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#fbbf24" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#fbbf24" opacity="0.25"/>



  <!-- Pure Dot-Matrix LED Pin Mascot Body (No Eyeballs) -->
