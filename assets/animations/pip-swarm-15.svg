<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <pattern id="piHalftone" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#180b2c"/>
      <rect x="0" y="0" width="2" height="2" fill="#c084fc"/>
      <rect x="2" y="2" width="2" height="2" fill="#c084fc"/>
    </pattern>
  </defs>

  <style>
    @keyframes vortexRing1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes vortexRing2 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes vortexRing3 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes levitateCenter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .ring-1 { animation: vortexRing1 8s steps(8) infinite; transform-origin: 80px 100px; }
    .ring-2 { animation: vortexRing2 12s steps(10) infinite; transform-origin: 80px 100px; }
    .ring-3 { animation: vortexRing3 18s steps(12) infinite; transform-origin: 80px 100px; }
    .pip-commander { animation: levitateCenter 1.8s steps(2) infinite; transform-origin: 80px 100px; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">15x TRIPLE</text>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="34" ry="5" fill="#f43f5e" opacity="0.25"/>

  <!-- Ring 3: Outer 7 Nodes -->
  <g class="ring-3">
    <circle cx="80" cy="100" r="68" fill="none" stroke="#15803d" stroke-width="1" stroke-dasharray="3,5" opacity="0.6"/>
    <g transform="translate(142, 94)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(119, 149)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(62, 163)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(16, 126)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(16, 62)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fbbf24"/></g>
    <g transform="translate(62, 25)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00ff41"/></g>
    <g transform="translate(119, 39)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00f0ff"/></g>
  </g>

  <!-- Ring 2: Mid 5 Nodes -->
  <g class="ring-2">
    <circle cx="80" cy="100" r="46" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>
    <g transform="translate(120, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(103, 133)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(48, 133)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(31, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(75, 50)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#fbbf24"/></g>
  </g>

  <!-- Ring 1: Inner 3 Nodes -->
  <g class="ring-1">
    <circle cx="80" cy="100" r="28" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="2,2" opacity="0.9"/>
    <g transform="translate(103, 96)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(68, 120)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(68, 72)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#fbbf24"/></g>
  </g>

  <!-- Sleek Eyeless Pi Mascot -->
  <g class="pip-commander">
    <!-- Left Hook -->
    <rect x="51" y="60" width="4" height="4" fill="#ff4071"/>
    <rect x="51" y="65" width="4" height="4" fill="#ff4071"/>
    <rect x="51" y="70" width="4" height="4" fill="#ff4071"/>
    
    <!-- Crossbar Row 1 ($y=65$) -->
    <rect x="56" y="65" width="4" height="4" fill="#ff4071"/>
    <rect x="61" y="65" width="4" height="4" fill="#f43f5e"/>
    <rect x="66" y="65" width="4" height="4" fill="#f43f5e"/>
    <rect x="71" y="65" width="4" height="4" fill="#ec4899"/>
    <rect x="76" y="65" width="4" height="4" fill="#c026d3"/>
    <rect x="81" y="65" width="4" height="4" fill="#a855f7"/>
    <rect x="86" y="65" width="4" height="4" fill="#9333ea"/>
    <rect x="91" y="65" width="4" height="4" fill="#7c3aed"/>
    <rect x="96" y="65" width="4" height="4" fill="#3b82f6"/>
    <rect x="101" y="65" width="4" height="4" fill="#0ea5e9"/>
    <rect x="106" y="65" width="4" height="4" fill="#00f0ff"/>
    <rect x="106" y="70" width="4" height="4" fill="#00f0ff"/>

    <!-- Crossbar Row 2 ($y=70$) -->
    <rect x="56" y="70" width="4" height="4" fill="#ff4071"/>
    <rect x="61" y="70" width="4" height="4" fill="#f43f5e"/>
    <rect x="66" y="70" width="4" height="4" fill="#f43f5e"/>
    <rect x="71" y="70" width="4" height="4" fill="#ec4899"/>
    <rect x="76" y="70" width="4" height="4" fill="#c026d3"/>
    <rect x="81" y="70" width="4" height="4" fill="#a855f7"/>
    <rect x="86" y="70" width="4" height="4" fill="#9333ea"/>
    <rect x="91" y="70" width="4" height="4" fill="#7c3aed"/>
    <rect x="96" y="70" width="4" height="4" fill="#3b82f6"/>
    <rect x="101" y="70" width="4" height="4" fill="#0ea5e9"/>

    <!-- Crossbar Row 3 ($y=75$) -->
    <rect x="56" y="75" width="4" height="4" fill="#f43f5e"/>
    <rect x="71" y="75" width="4" height="4" fill="#ec4899"/>
    <rect x="76" y="75" width="4" height="4" fill="#c026d3"/>
    <rect x="81" y="75" width="4" height="4" fill="#a855f7"/>
    <rect x="86" y="75" width="4" height="4" fill="#9333ea"/>
    <rect x="101" y="75" width="4" height="4" fill="#00f0ff"/>

    <!-- Left Leg -->
    <rect x="61" y="75" width="4" height="4" fill="#f43f5e"/>
    <rect x="66" y="75" width="4" height="4" fill="#f43f5e"/>
    <rect x="61" y="80" width="4" height="4" fill="#ec4899"/>
    <rect x="66" y="80" width="4" height="4" fill="#ec4899"/>
    <rect x="61" y="85" width="4" height="4" fill="#ec4899"/>
    <rect x="66" y="85" width="4" height="4" fill="#ec4899"/>
    <rect x="61" y="90" width="4" height="4" fill="#d946ef"/>
    <rect x="66" y="90" width="4" height="4" fill="#d946ef"/>
    <rect x="61" y="95" width="4" height="4" fill="#c026d3"/>
    <rect x="66" y="95" width="4" height="4" fill="#c026d3"/>
    <rect x="61" y="100" width="4" height="4" fill="#a855f7"/>
    <rect x="66" y="100" width="4" height="4" fill="#a855f7"/>
    <rect x="61" y="105" width="4" height="4" fill="#9333ea"/>
    <rect x="66" y="105" width="4" height="4" fill="#9333ea"/>
    <rect x="61" y="110" width="4" height="4" fill="#7e22ce"/>
    <rect x="66" y="110" width="4" height="4" fill="#7e22ce"/>
    <rect x="61" y="115" width="4" height="4" fill="#581c87"/>
    <rect x="66" y="115" width="4" height="4" fill="#581c87"/>
    <rect x="56" y="120" width="4" height="4" fill="#701a75"/>
    <rect x="61" y="120" width="4" height="4" fill="#581c87"/>
    <rect x="66" y="120" width="4" height="4" fill="#581c87"/>
    <rect x="71" y="120" width="4" height="4" fill="#701a75"/>
    <rect x="56" y="125" width="4" height="4" fill="#3b0764"/>
    <rect x="61" y="125" width="4" height="4" fill="#c084fc"/>
    <rect x="66" y="125" width="4" height="4" fill="#3b0764"/>
    <rect x="71" y="125" width="4" height="4" fill="#c084fc"/>

    <!-- Right Leg -->
    <rect x="91" y="75" width="4" height="4" fill="#7c3aed"/>
    <rect x="96" y="75" width="4" height="4" fill="#7c3aed"/>
    <rect x="91" y="80" width="4" height="4" fill="#3b82f6"/>
    <rect x="96" y="80" width="4" height="4" fill="#3b82f6"/>
    <rect x="91" y="85" width="4" height="4" fill="#2563eb"/>
    <rect x="96" y="85" width="4" height="4" fill="#2563eb"/>
    <rect x="91" y="90" width="4" height="4" fill="#1d4ed8"/>
    <rect x="96" y="90" width="4" height="4" fill="#1d4ed8"/>
    <rect x="91" y="95" width="4" height="4" fill="#0284c7"/>
    <rect x="96" y="95" width="4" height="4" fill="#0284c7"/>
    <rect x="91" y="100" width="4" height="4" fill="#0ea5e9"/>
    <rect x="96" y="100" width="4" height="4" fill="#0ea5e9"/>
    <rect x="91" y="105" width="4" height="4" fill="#06b6d4"/>
    <rect x="96" y="105" width="4" height="4" fill="#06b6d4"/>
    <!-- Curving Outward to the Right -->
    <rect x="91" y="110" width="4" height="4" fill="#06b6d4"/>
    <rect x="96" y="110" width="4" height="4" fill="#00f0ff"/>
    <rect x="101" y="110" width="4" height="4" fill="#00f0ff"/>
    <!-- Upswept Pi Tail Foot -->
    <rect x="96" y="115" width="4" height="4" fill="#00f0ff"/>
    <rect x="101" y="115" width="4" height="4" fill="#00f0ff"/>
    <rect x="106" y="115" width="4" height="4" fill="#00f0ff"/>
    <!-- Upward Curl Tip -->
    <rect x="106" y="110" width="4" height="4" fill="#00f0ff"/>
  </g>
</svg>
