<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
  <style>
    @keyframes swarmBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1px); }
    }
    @keyframes miniLeft {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-1px, -2px); }
    }
    @keyframes miniRight {
      0%, 100% { transform: translate(0px, -2px); }
      50% { transform: translate(1px, 0px); }
    }
    @keyframes miniTop {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(0px, -2px); }
    }
    @keyframes pulseLink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .mascot-swarm { animation: swarmBob 1.6s steps(2) infinite; }
    .sub-left { animation: miniLeft 1.8s steps(2) infinite; }
    .sub-right { animation: miniRight 2.0s steps(2) infinite; }
    .sub-top { animation: miniTop 1.5s steps(2) infinite; }
    .link-pulse { animation: pulseLink 1.2s steps(2) infinite; }
  </style>

  <!-- High-Contrast Matrix Background -->
  <rect width="32" height="32" fill="#000000"/>

  <!-- Floor Shadow -->
  <rect x="7" y="29" width="18" height="1" fill="#001804" opacity="0.8"/>

  <!-- Pixel Dotted Matrix Laser Data Links -->
  <g class="link-pulse" fill="#00ff41">
    <rect x="6" y="9" width="1" height="1"/>
    <rect x="8" y="10" width="1" height="1"/>
    <rect x="10" y="11" width="1" height="1"/>

    <rect x="25" y="9" width="1" height="1"/>
    <rect x="23" y="10" width="1" height="1"/>
    <rect x="21" y="11" width="1" height="1"/>

    <rect x="15" y="4" width="1" height="1"/>
    <rect x="16" y="6" width="1" height="1"/>
  </g>

  <!-- Satellite Mini Subagent 1: Scout (Mint Phosphor, Top-Left) -->
  <g class="sub-left">
    <!-- Outline -->
    <rect x="2" y="5" width="7" height="2" fill="#00ff41"/>
    <rect x="3" y="6" width="5" height="1" fill="#000000"/>
    <rect x="3" y="7" width="2" height="3" fill="#00ff41"/>
    <rect x="6" y="7" width="2" height="3" fill="#00ff41"/>
    <rect x="4" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="6" y="6" width="1" height="1" fill="#ffffff"/>
  </g>

  <!-- Satellite Mini Subagent 2: Coder (Neon Green, Top-Right) -->
  <g class="sub-right">
    <rect x="23" y="5" width="7" height="2" fill="#00ff41"/>
    <rect x="24" y="6" width="5" height="1" fill="#000000"/>
    <rect x="24" y="7" width="2" height="3" fill="#39ff14"/>
    <rect x="27" y="7" width="2" height="3" fill="#39ff14"/>
    <rect x="25" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="27" y="6" width="1" height="1" fill="#ffffff"/>
  </g>

  <!-- Satellite Mini Subagent 3: Reviewer (Amber-Green, Top-Center) -->
  <g class="sub-top">
    <rect x="13" y="1" width="6" height="2" fill="#00ff41"/>
    <rect x="14" y="2" width="4" height="1" fill="#000000"/>
    <rect x="14" y="3" width="1" height="2" fill="#ffff00"/>
    <rect x="17" y="3" width="1" height="2" fill="#ffff00"/>
    <rect x="15" y="2" width="1" height="1" fill="#ffffff"/>
  </g>

  <!-- Main Orchestrator Pi -->
  <g class="mascot-swarm">
    <!-- High-Contrast Outlines -->
    <rect x="5" y="10" width="22" height="5" fill="#00ff41"/>
    <rect x="6" y="9" width="20" height="7" fill="#00ff41"/>
    <rect x="4" y="11" width="24" height="3" fill="#00ff41"/>

    <rect x="8" y="14" width="6" height="13" fill="#00ff41"/>
    <rect x="7" y="25" width="8" height="3" fill="#00ff41"/>

    <rect x="18" y="14" width="6" height="12" fill="#00ff41"/>
    <rect x="18" y="24" width="9" height="4" fill="#00ff41"/>
    <rect x="24" y="21" width="4" height="6" fill="#00ff41"/>

    <!-- Left Leg Black Separation & Fill -->
    <rect x="9" y="15" width="4" height="10" fill="#000000"/>
    <rect x="10" y="15" width="2" height="10" fill="#00ff41"/>
    <rect x="10" y="15" width="1" height="10" fill="#ffffff"/>
    <rect x="8" y="25" width="6" height="2" fill="#000000"/>

    <!-- Right Leg -->
    <rect x="19" y="15" width="4" height="9" fill="#000000"/>
    <rect x="20" y="15" width="2" height="9" fill="#00ff41"/>
    <rect x="20" y="15" width="1" height="9" fill="#ffffff"/>
    <rect x="19" y="24" width="7" height="2" fill="#000000"/>
    <rect x="24" y="22" width="3" height="3" fill="#000000"/>
    <rect x="25" y="22" width="2" height="2" fill="#00ff41"/>

    <!-- Head / Crossbar -->
    <rect x="6" y="10" width="20" height="5" fill="#000000"/>
    <rect x="7" y="10" width="18" height="5" fill="#00ff41"/>
    <rect x="7" y="9" width="18" height="1" fill="#ffffff"/>
    <rect x="6" y="14" width="20" height="1" fill="#000000"/>

    <!-- Visor -->
    <rect x="8" y="11" width="16" height="3" fill="#000000"/>

    <!-- Eyes (Phosphor Green) -->
    <g fill="#00ff41">
      <rect x="10" y="11" width="3" height="2"/>
      <rect x="11" y="11" width="1" height="1" fill="#ffffff"/>

      <rect x="19" y="11" width="3" height="2"/>
      <rect x="20" y="11" width="1" height="1" fill="#ffffff"/>
    </g>

    <!-- Conductor Wand (Neon Laser Node) -->
    <g fill="#39ff14">
      <rect x="23" y="12" width="4" height="1"/>
      <rect x="26" y="11" width="3" height="1"/>
      <rect x="28" y="10" width="1" height="1" fill="#ffffff"/>
    </g>
  </g>
</svg>
