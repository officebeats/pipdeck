<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="piCrossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="85%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="piLeftLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#c026d3"/>
      <stop offset="85%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="piRightLegGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="piHalftone" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#2e1065"/>
      <rect x="0" y="0" width="1.2" height="1.2" fill="#c084fc"/>
      <rect x="1.5" y="1.5" width="1.2" height="1.2" fill="#e879f9"/>
    </pattern>
  </defs>

  <style>
    @keyframes vortexRing1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes vortexRing2 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes vortexRing3 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes vortexRing4 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes levitateCenter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes psychicWaveWide { 0% { transform: scale(0.3); opacity: 0.9; } 50% { opacity: 0.4; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes lightningFlicker { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
    @keyframes rainFall1 { 0% { transform: translateY(-10px); opacity: 0; } 30% { opacity: 0.9; } 80% { opacity: 0.9; } 100% { transform: translateY(205px); opacity: 0; } }
    @keyframes rainFall2 { 0% { transform: translateY(-10px); opacity: 0; } 30% { opacity: 0.9; } 80% { opacity: 0.9; } 100% { transform: translateY(205px); opacity: 0; } }

    .ring-1 { animation: vortexRing1 6s steps(8) infinite; transform-origin: 80px 100px; }
    .ring-2 { animation: vortexRing2 10s steps(10) infinite; transform-origin: 80px 100px; }
    .ring-3 { animation: vortexRing3 14s steps(12) infinite; transform-origin: 80px 100px; }
    .ring-4 { animation: vortexRing4 18s steps(16) infinite; transform-origin: 80px 100px; }
    .pip-commander { animation: levitateCenter 1.6s steps(2) infinite; transform-origin: 80px 100px; }
    .psychic-ring-1 { animation: psychicWaveWide 1.8s steps(4) infinite; transform-origin: 80px 92px; }
    .psychic-ring-2 { animation: psychicWaveWide 1.8s steps(4) infinite 0.9s; transform-origin: 80px 92px; }
    .lightning-arc { animation: lightningFlicker 0.4s steps(2) infinite; }
    .rain-stream-1 { animation: rainFall1 2.2s steps(8) infinite; }
    .rain-stream-2 { animation: rainFall2 2.8s steps(8) infinite 1s; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/><line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>
  <!-- Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/><path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Cascading Rain in Cyber Pink and Cyan -->
  <g class="rain-stream-1" fill="#f43f5e" opacity="0.8"><rect x="10" y="0" width="1" height="8"/><rect x="36" y="0" width="1" height="12"/><rect x="124" y="0" width="1" height="10"/><rect x="150" y="0" width="1" height="8"/></g>
  <g class="rain-stream-2" fill="#00f0ff" opacity="0.8"><rect x="22" y="0" width="1" height="14"/><rect x="80" y="0" width="1" height="6"/><rect x="138" y="0" width="1" height="14"/></g>

  <!-- Telepathic Waves -->
  <g fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3,5">
    <ellipse cx="80" cy="92" rx="42" ry="52" class="psychic-ring-1"/>
    <ellipse cx="80" cy="92" rx="42" ry="52" class="psychic-ring-2"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#f43f5e" opacity="0.25"/>
  <ellipse cx="80" cy="180" rx="20" ry="2.5" fill="#00f0ff" opacity="0.75"/>

  <!-- Lightning Arcs -->
  <g class="lightning-arc" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,3" fill="none">
    <line x1="80" y1="92" x2="16" y2="30"/><line x1="80" y1="92" x2="144" y2="30"/>
    <line x1="80" y1="92" x2="16" y2="170"/><line x1="80" y1="92" x2="144" y2="170"/>
    <line x1="80" y1="92" x2="80" y2="20"/><line x1="80" y1="92" x2="80" y2="180"/>
  </g>

  <!-- RING 4: OUTER BOUNDARY (8 NODES - R=73px) -->
  <g class="ring-4">
    <circle cx="80" cy="100" r="73" fill="none" stroke="#15803d" stroke-width="1" stroke-dasharray="2,6" opacity="0.6"/>
    <g transform="translate(146, 94)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(126, 147)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(74, 167)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(23, 147)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(2, 94)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(23, 43)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(74, 22)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#fbbf24"/></g>
    <g transform="translate(126, 43)"><rect width="11" height="11" fill="#00ff41"/><rect x="1.5" y="1.5" width="8" height="8" fill="#000"/><rect x="3.5" y="3.5" width="4" height="4" fill="#00ff41"/></g>
  </g>

  <!-- RING 3: MID-OUTER BELT (10 NODES - R=56px) -->
  <g class="ring-3">
    <circle cx="80" cy="100" r="56" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="2,4" opacity="0.6"/>
    <g transform="translate(131, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(120, 128)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(92, 148)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(58, 148)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00ff41"/></g>
    <g transform="translate(30, 128)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(19, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(30, 62)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(58, 42)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(92, 42)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(120, 62)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00ff41"/></g>
  </g>

  <!-- RING 2: MID-INNER VORTEX (8 NODES - R=42px) -->
  <g class="ring-2">
    <circle cx="80" cy="100" r="42" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>
    <g transform="translate(114, 111)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#00f0ff"/></g>
    <g transform="translate(91, 134)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#fb923c"/></g>
    <g transform="translate(60, 134)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#00ff41"/></g>
    <g transform="translate(37, 111)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#c084fc"/></g>
    <g transform="translate(37, 80)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#f43f5e"/></g>
    <g transform="translate(60, 57)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#00f0ff"/></g>
    <g transform="translate(91, 57)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#fb923c"/></g>
    <g transform="translate(114, 80)"><rect width="9" height="9" fill="#00ff41"/><rect x="1.5" y="1.5" width="6" height="6" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#fbbf24"/></g>
  </g>

  <!-- RING 1: INNER DENSE CORE (6 NODES - R=26px) -->
  <g class="ring-1">
    <circle cx="80" cy="100" r="26" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="2,3" opacity="0.9"/>
    <g transform="translate(102, 96)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#00f0ff"/></g>
    <g transform="translate(89, 118)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#fb923c"/></g>
    <g transform="translate(63, 118)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#00ff41"/></g>
    <g transform="translate(50, 96)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(63, 74)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(89, 74)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#fbbf24"/></g>
  </g>

  <!-- Unified Cohesive Pi Mascot Body -->
  <g class="pip-commander">
    <!-- Left Leg -->
    <rect x="58" y="86" width="12" height="36" fill="url(#piLeftLegGrad)"/>
    <rect x="56" y="122" width="15" height="8" fill="url(#piHalftone)"/>
    <rect x="54" y="126" width="6" height="4" fill="#a855f7"/>

    <!-- Right Leg -->
    <rect x="90" y="86" width="12" height="28" fill="url(#piRightLegGrad)"/>
    <rect x="90" y="114" width="13" height="10" fill="#0284c7"/>
    <rect x="94" y="120" width="13" height="8" fill="#00f0ff"/>
    <rect x="103" y="116" width="6" height="8" fill="#00f0ff"/>
    <rect x="105" y="114" width="4" height="4" fill="#67e8f9"/>

    <!-- Top Crossbar -->
    <rect x="48" y="82" width="8" height="12" fill="#ff3366" rx="1"/>
    <rect x="52" y="78" width="56" height="13" fill="url(#piCrossbarGrad)" rx="1"/>
    <rect x="104" y="80" width="8" height="9" fill="#00f0ff" rx="1"/>
    <rect x="54" y="79" width="52" height="2" fill="#ffffff" opacity="0.65"/>

    <!-- Visor Bezel -->
    <rect x="68" y="82" width="24" height="8" fill="#09090b" rx="1"/>
    <rect x="69" y="83" width="22" height="6" fill="#18181b"/>

    <!-- Eyes -->
    <rect x="71" y="84" width="5" height="4" fill="#00f0ff"/>
    <rect x="72" y="85" width="2" height="2" fill="#ffffff"/>
    <rect x="84" y="84" width="5" height="4" fill="#00f0ff"/>
    <rect x="85" y="85" width="2" height="2" fill="#ffffff"/>

    <!-- Ear Antennas -->
    <rect x="46" y="84" width="4" height="6" fill="#ff3366" rx="1"/>
    <rect x="47" y="85" width="2" height="4" fill="#ffffff" opacity="0.8"/>
    <rect x="110" y="82" width="4" height="6" fill="#00f0ff" rx="1"/>
    <rect x="111" y="83" width="2" height="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">32x CROWD</text>
  </g>
</svg>
