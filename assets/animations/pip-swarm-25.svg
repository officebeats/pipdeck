  </g>

  <!-- Ring 1: Inner Core 4 Nodes -->
  <g class="ring-1">
    <circle cx="80" cy="100" r="24" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="2,2" opacity="0.9"/>
    <g transform="translate(100, 96)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#00f0ff"/></g>
