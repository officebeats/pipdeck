    <g transform="translate(52, 96)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(76, 72)"><rect width="8" height="8" fill="#00ff41"/><rect x="1" y="1" width="6" height="6" fill="#000"/><rect x="2" y="2" width="4" height="4" fill="#fbbf24"/></g>
  </g>

  <!-- Sleek Eyeless Pi Mascot -->
    <!-- CLEAN FLOATING 25% REDUCED RETRO PI (π) GLYPH (NO SHADOW) -->
