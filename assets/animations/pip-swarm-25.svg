    <rect x="64" y="116" width="3" height="3" fill="#7e22ce"/>
    <rect x="68" y="116" width="3" height="3" fill="#7e22ce"/>
    <!-- Left Foot Base + Halftone -->
    <rect x="60" y="120" width="3" height="3" fill="#701a75"/>
