<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <pattern id="piHalftone" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#180b2c"/>
      <rect x="0" y="0" width="2" height="2" fill="#c084fc"/>
      <rect x="2" y="2" width="2" height="2" fill="#c084fc"/>
    </pattern>
  </defs>

  <style>
    @keyframes vortexRing1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes vortexRing2 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes vortexRing3 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes vortexRing4 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes levitateCenter { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    .ring-1 { animation: vortexRing1 8s steps(8) infinite; transform-origin: 80px 100px; }
    .ring-2 { animation: vortexRing2 12s steps(10) infinite; transform-origin: 80px 100px; }
    .ring-3 { animation: vortexRing3 16s steps(12) infinite; transform-origin: 80px 100px; }
    .ring-4 { animation: vortexRing4 22s steps(14) infinite; transform-origin: 80px 100px; }
    .pip-commander { animation: levitateCenter 1.8s steps(2) infinite; transform-origin: 80px 100px; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">25x MATRIX</text>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="38" ry="5" fill="#f43f5e" opacity="0.25"/>

  <!-- Ring 4: Outer 8 Nodes -->
