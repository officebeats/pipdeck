    <g transform="translate(75, 149)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#f43f5e"/></g>
    <g transform="translate(36, 134)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00ff41"/></g>
    <g transform="translate(21, 95)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#c084fc"/></g>
    <g transform="translate(36, 56)"><rect width="10" height="10" fill="#00ff41"/><rect x="1.5" y="1.5" width="7" height="7" fill="#000"/><rect x="3" y="3" width="4" height="4" fill="#00f0ff"/></g>
