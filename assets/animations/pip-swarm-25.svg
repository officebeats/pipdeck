  </g>

  <!-- Ring 2: Mid-Inner 5 Nodes -->
  <g class="ring-2">
    <circle cx="80" cy="100" r="38" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>
