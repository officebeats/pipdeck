<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <pattern id="piHalftone" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#180b2c"/>
      <rect x="0" y="0" width="1" height="1" fill="#c084fc"/>
      <rect x="2" y="2" width="1" height="1" fill="#c084fc"/>
    </pattern>
  </defs>

  <style>
    @keyframes psychicPulse {
      0% { transform: scale(0.6); opacity: 0.8; }
      50% { opacity: 0.3; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes levitateFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes thoughtParticle1 {
      0% { transform: translateY(0px); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-70px); opacity: 0; }
    }
    @keyframes thoughtParticle2 {
      0% { transform: translateY(0px); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-70px); opacity: 0; }
    }

    .mascot-thinking { animation: levitateFloat 2s steps(4) infinite; transform-origin: 80px 100px; }
    .psychic-1 { animation: psychicPulse 1.8s steps(4) infinite; transform-origin: 80px 90px; }
    .psychic-2 { animation: psychicPulse 1.8s steps(4) infinite 0.9s; transform-origin: 80px 90px; }
    .tp-1 { animation: thoughtParticle1 2.2s steps(6) infinite; }
    .tp-2 { animation: thoughtParticle2 2.6s steps(6) infinite 1.1s; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">THINKING</text>
  </g>

  <!-- Expanding Psychic Waves in OMP Pink and Cyan -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="3,4">
    <circle cx="80" cy="90" r="32" stroke="#f43f5e" class="psychic-1"/>
    <circle cx="80" cy="90" r="32" stroke="#00f0ff" class="psychic-2"/>
  </g>

  <!-- Floating Logic Particles -->
  <g class="tp-1" fill="#00f0ff" transform="translate(0, 75)">
    <rect x="25" y="0" width="3" height="3"/><rect x="132" y="0" width="3" height="3"/><rect x="80" y="-10" width="4" height="4"/>
  </g>
  <g class="tp-2" fill="#ff4071" transform="translate(0, 85)">
    <rect x="40" y="0" width="3" height="3"/><rect x="118" y="0" width="3" height="3"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#f43f5e" opacity="0.25"/>
  <ellipse cx="80" cy="180" rx="20" ry="2.5" fill="#00f0ff" opacity="0.6"/>

  <!-- Official OMP Pi Logo Mascot Body -->
  <g class="mascot-thinking">
    <!-- Top Horizontal Crossbar (Pink -> Purple -> Cyan) -->
    <rect x="49" y="74" width="9" height="9" fill="#ff4071" stroke="#000" stroke-width="0.75"/>
    <rect x="58" y="74" width="9" height="9" fill="#f43f5e" stroke="#000" stroke-width="0.75"/>
    <rect x="67" y="74" width="9" height="9" fill="#c026d3" stroke="#000" stroke-width="0.75"/>
    <rect x="76" y="74" width="9" height="9" fill="#9333ea" stroke="#000" stroke-width="0.75"/>
    <rect x="85" y="74" width="9" height="9" fill="#6366f1" stroke="#000" stroke-width="0.75"/>
    <rect x="94" y="74" width="9" height="9" fill="#0ea5e9" stroke="#000" stroke-width="0.75"/>
    <rect x="103" y="74" width="9" height="9" fill="#00f0ff" stroke="#000" stroke-width="0.75"/>

    <!-- Left Leg -->
    <rect x="58" y="83" width="9" height="9" fill="#ec4899" stroke="#000" stroke-width="0.75"/>
    <rect x="58" y="92" width="9" height="9" fill="#a855f7" stroke="#000" stroke-width="0.75"/>
    <rect x="58" y="101" width="9" height="9" fill="#7e22ce" stroke="#000" stroke-width="0.75"/>
    <rect x="58" y="110" width="9" height="9" fill="url(#piHalftone)" stroke="#000" stroke-width="0.75"/>

    <!-- Right Leg -->
    <rect x="85" y="83" width="9" height="9" fill="#7c3aed" stroke="#000" stroke-width="0.75"/>
    <rect x="85" y="92" width="9" height="9" fill="#2563eb" stroke="#000" stroke-width="0.75"/>
    <rect x="85" y="101" width="9" height="9" fill="#0284c7" stroke="#000" stroke-width="0.75"/>
    <rect x="85" y="110" width="9" height="9" fill="#00f0ff" stroke="#000" stroke-width="0.75"/>

    <!-- Thinking Concentrating Eyes -->
    <rect x="70" y="76" width="5" height="4" fill="#00f0ff"/>
    <rect x="71" y="77" width="2" height="2" fill="#ffffff"/>
    <rect x="87" y="76" width="5" height="4" fill="#00f0ff"/>
    <rect x="88" y="77" width="2" height="2" fill="#ffffff"/>
  </g>
</svg>
