<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    /* LCD Stepped Frame Timing (4-8 FPS Authentic Embedded Matrix Stutter) */
    @keyframes thinkBob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes haloSpin1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes haloSpin2 { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes matrixDust { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-30px); opacity: 0; } }
    @keyframes eyeLook { 0%, 100% { transform: translate(0px, 0px); } 30% { transform: translate(2px, -2px); } 70% { transform: translate(-2px, -2px); } }

    .mascot-think { animation: thinkBob 1.6s steps(2) infinite; transform-origin: 80px 100px; }
    .halo-group-1 { animation: haloSpin1 4s steps(8) infinite; transform-origin: 80px 60px; }
    .halo-group-2 { animation: haloSpin2 6s steps(12) infinite; transform-origin: 80px 60px; }
    .dust-particles { animation: matrixDust 2s steps(4) infinite; }
    .eye-scan { animation: eyeLook 2.4s steps(3) infinite; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="25" x2="160" y2="25"/><line x1="0" y1="50" x2="160" y2="50"/><line x1="0" y1="150" x2="160" y2="150"/><line x1="0" y1="175" x2="160" y2="175"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/><path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <g class="dust-particles" fill="#00ff41">
    <rect x="24" y="50" width="2" height="2"/>
    <rect x="136" y="44" width="2" height="2"/>
    <rect x="30" y="160" width="2" height="2"/>
    <rect x="130" y="150" width="2" height="2"/>
    <rect x="80" y="24" width="2" height="3" fill="#39ff14"/>
  </g>

  <ellipse cx="80" cy="144" rx="28" ry="5" fill="#00ff41" opacity="0.25"/>
  <ellipse cx="80" cy="144" rx="16" ry="2.5" fill="#00ff41" opacity="0.6"/>

  <g class="halo-group-1">
    <ellipse cx="80" cy="60" rx="36" ry="12" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="114" y="58" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="halo-group-2">
    <ellipse cx="80" cy="60" rx="24" ry="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6"/>
    <rect x="56" y="58" width="4" height="4" fill="#38bdf8"/>
  </g>

  <!-- Mascot Body (Centered at 80, 100) -->
  <g class="mascot-think">
    <rect x="56" y="80" width="48" height="12" fill="#00ff41"/><rect x="60" y="78" width="40" height="16" fill="#00ff41"/><rect x="52" y="82" width="56" height="8" fill="#00ff41"/>
    <rect x="62" y="92" width="14" height="28" fill="#00ff41"/><rect x="60" y="118" width="18" height="8" fill="#00ff41"/>
    <rect x="84" y="92" width="14" height="26" fill="#00ff41"/><rect x="84" y="116" width="20" height="10" fill="#00ff41"/><rect x="98" y="110" width="8" height="12" fill="#00ff41"/>
    <rect x="64" y="94" width="10" height="24" fill="#000000"/><rect x="66" y="94" width="7" height="24" fill="#00ff41"/><rect x="66" y="94" width="2" height="24" fill="#ffffff"/>
    <rect x="62" y="120" width="14" height="4" fill="#000000"/><rect x="64" y="120" width="10" height="3" fill="#00ff41"/>
    <rect x="86" y="94" width="10" height="22" fill="#000000"/><rect x="88" y="94" width="7" height="22" fill="#00ff41"/><rect x="88" y="94" width="2" height="22" fill="#ffffff"/>
    <rect x="86" y="118" width="16" height="6" fill="#000000"/><rect x="88" y="118" width="13" height="4" fill="#00ff41"/><rect x="100" y="112" width="4" height="8" fill="#000000"/><rect x="101" y="113" width="3" height="5" fill="#00ff41"/>
    <rect x="58" y="80" width="44" height="12" fill="#000000"/><rect x="60" y="80" width="40" height="12" fill="#00ff41"/><rect x="60" y="78" width="40" height="2" fill="#ffffff"/><rect x="58" y="91" width="44" height="1" fill="#000000"/>
    <rect x="62" y="82" width="36" height="8" fill="#000000"/>
    <g class="eye-scan" fill="#38bdf8">
      <rect x="68" y="83" width="6" height="5"/><rect x="70" y="83" width="3" height="3" fill="#ffffff"/>
      <rect x="86" y="83" width="6" height="5"/><rect x="88" y="83" width="3" height="3" fill="#ffffff"/>
    </g>
    <rect x="94" y="94" width="5" height="5" fill="#00ff41"/><rect x="95" y="95" width="3" height="3" fill="#ffffff"/>
  </g>
</svg>
