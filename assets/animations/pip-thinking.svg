<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="piCrossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="85%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="piLeftLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#c026d3"/>
      <stop offset="85%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="piRightLegGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="piHalftone" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#2e1065"/>
      <rect x="0" y="0" width="1.2" height="1.2" fill="#c084fc"/>
      <rect x="1.5" y="1.5" width="1.2" height="1.2" fill="#e879f9"/>
    </pattern>
  </defs>

  <style>
    @keyframes psychicPulse { 0% { transform: scale(0.6); opacity: 0.8; } 50% { opacity: 0.3; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes levitateFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes thoughtParticle1 { 0% { transform: translateY(0px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
    @keyframes thoughtParticle2 { 0% { transform: translateY(0px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }

    .mascot-thinking { animation: levitateFloat 2s steps(4) infinite; transform-origin: 80px 100px; }
    .psychic-1 { animation: psychicPulse 1.8s steps(4) infinite; transform-origin: 80px 90px; }
    .psychic-2 { animation: psychicPulse 1.8s steps(4) infinite 0.9s; transform-origin: 80px 90px; }
    .tp-1 { animation: thoughtParticle1 2.2s steps(6) infinite; }
    .tp-2 { animation: thoughtParticle2 2.6s steps(6) infinite 1.1s; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">THINKING</text>
  </g>

  <!-- Expanding Psychic Waves in OMP Pink and Cyan -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="3,4">
    <circle cx="80" cy="90" r="32" stroke="#ff3366" class="psychic-1"/>
    <circle cx="80" cy="90" r="32" stroke="#00f0ff" class="psychic-2"/>
  </g>

  <!-- Floating Logic Particles -->
  <g class="tp-1" fill="#00f0ff" transform="translate(0, 75)">
    <rect x="25" y="0" width="3" height="3"/><rect x="132" y="0" width="3" height="3"/><rect x="80" y="-10" width="4" height="4"/>
  </g>
  <g class="tp-2" fill="#ff3366" transform="translate(0, 85)">
    <rect x="40" y="0" width="3" height="3"/><rect x="118" y="0" width="3" height="3"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#f43f5e" opacity="0.25"/>
  <ellipse cx="80" cy="180" rx="20" ry="2.5" fill="#00f0ff" opacity="0.6"/>

  <!-- Unified Cohesive Pi Mascot Body -->
  <g class="mascot-thinking">
    <!-- Left Leg -->
    <rect x="58" y="86" width="12" height="36" fill="url(#piLeftLegGrad)"/>
    <rect x="56" y="122" width="15" height="8" fill="url(#piHalftone)"/>
    <rect x="54" y="126" width="6" height="4" fill="#a855f7"/>

    <!-- Right Leg -->
    <rect x="90" y="86" width="12" height="28" fill="url(#piRightLegGrad)"/>
    <rect x="90" y="114" width="13" height="10" fill="#0284c7"/>
    <rect x="94" y="120" width="13" height="8" fill="#00f0ff"/>
    <rect x="103" y="116" width="6" height="8" fill="#00f0ff"/>
    <rect x="105" y="114" width="4" height="4" fill="#67e8f9"/>

    <!-- Top Crossbar with Serifs -->
    <rect x="48" y="82" width="8" height="12" fill="#ff3366" rx="1"/>
    <rect x="52" y="78" width="56" height="13" fill="url(#piCrossbarGrad)" rx="1"/>
    <rect x="104" y="80" width="8" height="9" fill="#00f0ff" rx="1"/>
    <rect x="54" y="79" width="52" height="2" fill="#ffffff" opacity="0.65"/>

    <!-- Visor Bezel -->
    <rect x="68" y="82" width="24" height="8" fill="#09090b" rx="1"/>
    <rect x="69" y="83" width="22" height="6" fill="#18181b"/>

    <!-- Thinking Eyes (Cyan #00f0ff) -->
    <rect x="71" y="84" width="5" height="4" fill="#00f0ff"/>
    <rect x="72" y="85" width="2" height="2" fill="#ffffff"/>
    <rect x="84" y="84" width="5" height="4" fill="#00f0ff"/>
    <rect x="85" y="85" width="2" height="2" fill="#ffffff"/>

    <!-- Ear Antennas -->
    <rect x="46" y="84" width="4" height="6" fill="#ff3366" rx="1"/>
    <rect x="47" y="85" width="2" height="4" fill="#ffffff" opacity="0.8"/>
    <rect x="110" y="82" width="4" height="6" fill="#00f0ff" rx="1"/>
    <rect x="111" y="83" width="2" height="4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
