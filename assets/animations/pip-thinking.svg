<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    @keyframes psychicPulse {
      0% { transform: scale(0.6); opacity: 0.8; }
      50% { opacity: 0.3; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes levitateFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes thoughtParticle1 {
      0% { transform: translateY(0px); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-70px); opacity: 0; }
    }
    @keyframes thoughtParticle2 {
      0% { transform: translateY(0px); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-70px); opacity: 0; }
    }

    .mascot-thinking { animation: levitateFloat 2s steps(4) infinite; transform-origin: 80px 100px; }
    .psychic-1 { animation: psychicPulse 1.8s steps(4) infinite; transform-origin: 80px 90px; }
    .psychic-2 { animation: psychicPulse 1.8s steps(4) infinite 0.9s; transform-origin: 80px 90px; }
    .tp-1 { animation: thoughtParticle1 2.2s steps(6) infinite; }
    .tp-2 { animation: thoughtParticle2 2.6s steps(6) infinite 1.1s; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">THINKING</text>
  </g>

  <!-- Expanding Psychic Rings (Spanning Top to Bottom) -->
  <g fill="none" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="3,4">
    <circle cx="80" cy="90" r="32" class="psychic-1"/>
    <circle cx="80" cy="90" r="32" class="psychic-2"/>
  </g>

  <!-- Floating Logic & Calculation Particles Reaching Top -->
  <g class="tp-1" fill="#38bdf8" transform="translate(0, 75)">
    <rect x="25" y="0" width="3" height="3"/><rect x="132" y="0" width="3" height="3"/><rect x="80" y="-10" width="4" height="4"/>
  </g>
  <g class="tp-2" fill="#00ff41" transform="translate(0, 85)">
    <rect x="40" y="0" width="3" height="3"/><rect x="118" y="0" width="3" height="3"/>
  </g>

  <!-- Ground Levitation Floor (Squeezed to Bottom) -->
  <g opacity="0.6" stroke="#00ff41" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#00ff41" opacity="0.25"/>
  <ellipse cx="80" cy="180" rx="20" ry="2.5" fill="#00ff41" opacity="0.6"/>

  <!-- Mascot Body -->
  <g class="mascot-thinking">
    <rect x="64" y="84" width="32" height="10" fill="#00ff41"/><rect x="66" y="82" width="28" height="14" fill="#00ff41"/><rect x="62" y="86" width="36" height="6" fill="#00ff41"/>
    <rect x="68" y="94" width="10" height="22" fill="#00ff41"/><rect x="66" y="114" width="14" height="6" fill="#00ff41"/>
    <rect x="82" y="94" width="10" height="20" fill="#00ff41"/><rect x="82" y="112" width="16" height="8" fill="#00ff41"/><rect x="94" y="106" width="6" height="10" fill="#00ff41"/>
    <rect x="70" y="96" width="6" height="18" fill="#000000"/><rect x="71" y="96" width="5" height="18" fill="#00ff41"/><rect x="71" y="96" width="2" height="18" fill="#ffffff"/>
    <rect x="84" y="96" width="6" height="16" fill="#000000"/><rect x="85" y="96" width="5" height="16" fill="#00ff41"/><rect x="85" y="96" width="2" height="16" fill="#ffffff"/>
    
    <rect x="66" y="84" width="28" height="10" fill="#000000"/><rect x="67" y="84" width="26" height="10" fill="#00ff41"/><rect x="67" y="82" width="26" height="2" fill="#ffffff"/>
    <rect x="69" y="85" width="22" height="7" fill="#000000"/>

    <!-- Concentrating / Processing Eyes -->
    <rect x="72" y="86" width="5" height="5" fill="#38bdf8"/><rect x="73" y="87" width="2" height="2" fill="#ffffff"/>
    <rect x="83" y="86" width="5" height="5" fill="#38bdf8"/><rect x="84" y="87" width="2" height="2" fill="#ffffff"/>

    <g fill="#00ff41">
      <rect x="58" y="86" width="4" height="6"/><rect x="98" y="86" width="4" height="6"/>
    </g>
  </g>
</svg>
