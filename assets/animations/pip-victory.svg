<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="piCrossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="85%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="piLeftLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#c026d3"/>
      <stop offset="85%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="piRightLegGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="piHalftone" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#2e1065"/>
      <rect x="0" y="0" width="1.2" height="1.2" fill="#c084fc"/>
      <rect x="1.5" y="1.5" width="1.2" height="1.2" fill="#e879f9"/>
    </pattern>
  </defs>

  <style>
    @keyframes victoryBounce { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes sparkleFloat1 { 0% { opacity: 0; transform: translateY(10px) scale(0.6); } 50% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { opacity: 0; transform: translateY(-70px) scale(0.6); } }
    @keyframes sparkleFloat2 { 0% { opacity: 0; transform: translateY(10px) scale(0.6); } 50% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { opacity: 0; transform: translateY(-70px) scale(0.6); } }

    .mascot-victory { animation: victoryBounce 0.8s steps(4) infinite; transform-origin: 80px 100px; }
    .sparkle-1 { animation: sparkleFloat1 1.6s steps(6) infinite; }
    .sparkle-2 { animation: sparkleFloat2 1.6s steps(6) infinite 0.8s; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">VICTORY</text>
  </g>

  <!-- Confetti / Sparkles -->
  <g class="sparkle-1" fill="#facc15" transform="translate(0, 80)">
    <rect x="25" y="0" width="4" height="4"/><rect x="135" y="0" width="4" height="4"/><rect x="80" y="-30" width="5" height="5"/>
  </g>
  <g class="sparkle-2" fill="#00f0ff" transform="translate(0, 90)">
    <rect x="40" y="0" width="4" height="4"/><rect x="120" y="0" width="4" height="4"/><rect x="65" y="-35" width="4" height="4"/>
  </g>

  <!-- Victory Trophy Floating Over Head -->
  <g transform="translate(70, 36)" fill="#fbbf24">
    <rect x="4" y="0" width="12" height="10"/>
    <rect x="6" y="10" width="8" height="4"/>
    <rect x="2" y="14" width="16" height="4"/>
    <rect x="0" y="2" width="4" height="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="16" y="2" width="4" height="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#f43f5e" opacity="0.25"/>



  <!-- Pure Dot-Matrix LED Pin Mascot Body (No Eyeballs) -->
  <g class="mascot-victory">
    <circle cx="48" cy="70" r="1.65" fill="#ff3366"/> <circle cx="48" cy="74" r="1.65" fill="#ff3366"/> <circle cx="52" cy="70" r="1.65" fill="#ff3366"/> <circle cx="52" cy="74" r="1.65" fill="#ff3366"/> <circle cx="52" cy="78" r="1.65" fill="#ff3366"/> <circle cx="56" cy="70" r="1.65" fill="#ff3366"/> <circle cx="56" cy="74" r="1.65" fill="#ff3366"/> <circle cx="56" cy="78" r="1.65" fill="#ff3366"/> <circle cx="60" cy="70" r="1.65" fill="#ff3366"/> <circle cx="60" cy="74" r="1.65" fill="#ff3366"/> <circle cx="60" cy="78" r="1.65" fill="#ff3366"/> <circle cx="64" cy="70" r="1.65" fill="#f43f5e"/> <circle cx="64" cy="74" r="1.65" fill="#f43f5e"/> <circle cx="64" cy="78" r="1.65" fill="#f43f5e"/> <circle cx="68" cy="70" r="1.65" fill="#f43f5e"/> <circle cx="68" cy="74" r="1.65" fill="#f43f5e"/> <circle cx="68" cy="78" r="1.65" fill="#f43f5e"/> <circle cx="72" cy="70" r="1.65" fill="#f43f5e"/> <circle cx="72" cy="74" r="1.65" fill="#f43f5e"/> <circle cx="72" cy="78" r="1.65" fill="#f43f5e"/> <circle cx="76" cy="70" r="1.65" fill="#a855f7"/> <circle cx="76" cy="74" r="1.65" fill="#a855f7"/> <circle cx="76" cy="78" r="1.65" fill="#a855f7"/> <circle cx="80" cy="70" r="1.65" fill="#a855f7"/> <circle cx="80" cy="74" r="1.65" fill="#a855f7"/> <circle cx="80" cy="78" r="1.65" fill="#a855f7"/> <circle cx="84" cy="70" r="1.65" fill="#a855f7"/> <circle cx="84" cy="74" r="1.65" fill="#a855f7"/> <circle cx="84" cy="78" r="1.65" fill="#a855f7"/> <circle cx="88" cy="70" r="1.65" fill="#6366f1"/> <circle cx="88" cy="74" r="1.65" fill="#6366f1"/> <circle cx="88" cy="78" r="1.65" fill="#6366f1"/> <circle cx="92" cy="70" r="1.65" fill="#6366f1"/> <circle cx="92" cy="74" r="1.65" fill="#6366f1"/> <circle cx="92" cy="78" r="1.65" fill="#6366f1"/> <circle cx="96" cy="70" r="1.65" fill="#6366f1"/> <circle cx="96" cy="74" r="1.65" fill="#6366f1"/> <circle cx="96" cy="78" r="1.65" fill="#6366f1"/> <circle cx="100" cy="70" r="1.65" fill="#0ea5e9"/> <circle cx="100" cy="74" r="1.65" fill="#0ea5