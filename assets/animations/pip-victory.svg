<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <pattern id="piHalftone" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#180b2c"/>
      <rect x="0" y="0" width="2" height="2" fill="#c084fc"/>
      <rect x="2" y="2" width="2" height="2" fill="#c084fc"/>
    </pattern>
  </defs>

  <style>
    @keyframes victoryBounce { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes sparkleFloat1 { 0% { opacity: 0; transform: translateY(10px) scale(0.6); } 50% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { opacity: 0; transform: translateY(-70px) scale(0.6); } }
    @keyframes sparkleFloat2 { 0% { opacity: 0; transform: translateY(10px) scale(0.6); } 50% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { opacity: 0; transform: translateY(-70px) scale(0.6); } }

    .mascot-victory { animation: victoryBounce 0.8s steps(4) infinite; transform-origin: 80px 100px; }
    .sparkle-1 { animation: sparkleFloat1 1.6s steps(6) infinite; }
    .sparkle-2 { animation: sparkleFloat2 1.6s steps(6) infinite 0.8s; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">VICTORY</text>
  </g>

  <!-- Confetti / Sparkles -->
  <g class="sparkle-1" fill="#facc15" transform="translate(0, 80)">
    <rect x="25" y="0" width="4" height="4"/><rect x="135" y="0" width="4" height="4"/><rect x="80" y="-30" width="5" height="5"/>
  </g>
  <g class="sparkle-2" fill="#00f0ff" transform="translate(0, 90)">
    <rect x="40" y="0" width="4" height="4"/><rect x="120" y="0" width="4" height="4"/><rect x="65" y="-35" width="4" height="4"/>
  </g>

  <!-- Victory Trophy -->
  <g transform="translate(70, 36)" fill="#fbbf24">
    <rect x="4" y="0" width="12" height="10"/>
    <rect x="6" y="10" width="8" height="4"/>
    <rect x="2" y="14" width="16" height="4"/>
    <rect x="0" y="2" width="4" height="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="16" y="2" width="4" height="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="38" ry="5" fill="#f43f5e" opacity="0.25"/>

  <!-- Retro LCD Dot-Matrix Pi Mascot (Victory) -->
  <g class="mascot-victory">
    <!-- Crossbar Row 1 ($y=69$) -->
    <rect x="42" y="64" width="4" height="4" fill="#ff4071"/>
    <rect x="42" y="69" width="4" height="4" fill="#ff4071"/>
    <rect x="42" y="74" width="4" height="4" fill="#ff4071"/>
    <rect x="47" y="69" width="4" height="4" fill="#ff4071"/>
    <rect x="52" y="69" width="4" height="4" fill="#f43f5e"/>
    <rect x="57" y="69" width="4" height="4" fill="#f43f5e"/>
    <rect x="62" y="69" width="4" height="4" fill="#ec4899"/>
    <rect x="67" y="69" width="4" height="4" fill="#c026d3"/>
    <rect x="72" y="69" width="4" height="4" fill="#a855f7"/>
    <rect x="77" y="69" width="4" height="4" fill="#9333ea"/>
    <rect x="82" y="69" width="4" height="4" fill="#7c3aed"/>
    <rect x="87" y="69" width="4" height="4" fill="#6366f1"/>
    <rect x="92" y="69" width="4" height="4" fill="#3b82f6"/>
    <rect x="97" y="69" width="4" height="4" fill="#0ea5e9"/>
    <rect x="102" y="69" width="4" height="4" fill="#06b6d4"/>
    <rect x="107" y="69" width="4" height="4" fill="#00f0ff"/>
    <rect x="112" y="69" width="4" height="4" fill="#00f0ff"/>
    <rect x="117" y="69" width="4" height="4" fill="#00f0ff"/>
    <rect x="117" y="74" width="4" height="4" fill="#00f0ff"/>

    <!-- Crossbar Row 2 ($y=74$) -->
    <rect x="47" y="74" width="4" height="4" fill="#ff4071"/>
    <rect x="52" y="74" width="4" height="4" fill="#f43f5e"/>
    <rect x="57" y="74" width="4" height="4" fill="#f43f5e"/>
    <rect x="62" y="74" width="4" height="4" fill="#ec4899"/>
    <rect x="67" y="74" width="4" height="4" fill="#c026d3"/>
    <rect x="72" y="74" width="4" height="4" fill="#a855f7"/>
    <rect x="77" y="74" width="4" height="4" fill="#9333ea"/>
    <rect x="82" y="74" width="4" height="4" fill="#7c3aed"/>
    <rect x="87" y="74" width="4" height="4" fill="#6366f1"/>
    <rect x="92" y="74" width="4" height="4" fill="#3b82f6"/>
    <rect x="97" y="74" width="4" height="4" fill="#0ea5e9"/>
    <rect x="102" y="74" width="4" height="4" fill="#06b6d4"/>
    <rect x="107" y="74" width="4" height="4" fill="#00f0ff"/>
    <rect x="112" y="74" width="4" height="4" fill="#00f0ff"/>

    <!-- Left Leg -->
    <rect x="57" y="79" width="4" height="4" fill="#f43f5e"/>
    <rect x="62" y="79" width="4" height="4" fill="#f43f5e"/>
    <rect x="57" y="84" width="4" height="4" fill="#ec4899"/>
    <rect x="62" y="84" width="4" height="4" fill="#ec4899"/>
    <rect x="57" y="89" width="4" height="4" fill="#ec4899"/>
    <rect x="62" y="89" width="4" height="4" fill="#ec4899"/>
    <rect x="57" y="94" width="4" height="4" fill="#d946ef"/>
    <rect x="62" y="94" width="4" height="4" fill="#d946ef"/>
    <rect x="57" y="99" width="4" height="4" fill="#a855f7"/>
    <rect x="62" y="99" width="4" height="4" fill="#a855f7"/>
    <rect x="57" y="104" width="4" height="4" fill="#9333ea"/>
    <rect x="62" y="104" width="4" height="4" fill="#9333ea"/>
    <rect x="57" y="109" width="4" height="4" fill="#7e22ce"/>
    <rect x="62" y="109" width="4" height="4" fill="#7e22ce"/>
    <!-- Left Foot Base + Halftone -->
    <rect x="52" y="114" width="4" height="4" fill="#701a75"/>
    <rect x="57" y="114" width="4" height="4" fill="#581c87"/>
    <rect x="62" y="114" width="4" height="4" fill="#581c87"/>
    <rect x="67" y="114" width="4" height="4" fill="#701a75"/>
    <rect x="52" y="119" width="4" height="4" fill="#3b0764"/>
    <rect x="57" y="119" width="4" height="4" fill="#c084fc"/>
    <rect x="62" y="119" width="4" height="4" fill="#3b0764"/>
    <rect x="67" y="119" width="4" height="4" fill="#c084fc"/>

    <!-- Right Leg -->
    <rect x="97" y="79" width="4" height="4" fill="#3b82f6"/>
    <rect x="102" y="79" width="4" height="4" fill="#3b82f6"/>
    <rect x="97" y="84" width="4" height="4" fill="#2563eb"/>
    <rect x="102" y="84" width="4" height="4" fill="#2563eb"/>
    <rect x="97" y="89" width="4" height="4" fill="#1d4ed8"/>
    <rect x="102" y="89" width="4" height="4" fill="#1d4ed8"/>
    <rect x="97" y="94" width="4" height="4" fill="#0284c7"/>
    <rect x="102" y="94" width="4" height="4" fill="#0284c7"/>
    <rect x="97" y="99" width="4" height="4" fill="#0ea5e9"/>
    <rect x="102" y="99" width="4" height="4" fill="#0ea5e9"/>
    <rect x="97" y="104" width="4" height="4" fill="#06b6d4"/>
    <rect x="102" y="104" width="4" height="4" fill="#06b6d4"/>
    <rect x="107" y="104" width="4" height="4" fill="#00f0ff"/>
    <rect x="102" y="109" width="4" height="4" fill="#00f0ff"/>
    <rect x="107" y="109" width="4" height="4" fill="#00f0ff"/>
    <rect x="112" y="109" width="4" height="4" fill="#00f0ff"/>
    <rect x="112" y="104" width="4" height="4" fill="#00f0ff"/>

    <!-- Happy Eyes (Arcs) -->
    <path d="M67,77 Q70,72 73,77" stroke="#00f0ff" stroke-width="2.5" fill="none"/>
    <path d="M92,77 Q95,72 98,77" stroke="#00f0ff" stroke-width="2.5" fill="none"/>
  </g>
</svg>
