<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    @keyframes winSway { 0%, 100% { transform: translateY(0px) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes confettiDrop1 { 0% { opacity: 0; transform: translateY(-10px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(200px); } }
    @keyframes confettiDrop2 { 0% { opacity: 0; transform: translateY(-10px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(200px); } }
    @keyframes shadesGleam { 0%, 70%, 100% { opacity: 0; } 75%, 90% { opacity: 1; } }

    .mascot-win { animation: winSway 1.8s steps(4) infinite; transform-origin: 80px 140px; }
    .confetti-1 { animation: confettiDrop1 2.4s steps(8) infinite; }
    .confetti-2 { animation: confettiDrop2 2.8s steps(8) infinite 1.2s; }
    .gleam { animation: shadesGleam 2.5s steps(2) infinite; }
  </style>

  <rect width="160" height="200" fill="#000000"/>

  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="25" x2="160" y2="25"/><line x1="0" y1="50" x2="160" y2="50"/><line x1="0" y1="150" x2="160" y2="150"/><line x1="0" y1="175" x2="160" y2="175"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/><path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Full-Bleed Stepped Matrix Confetti -->
  <g class="confetti-1">
    <rect x="18" y="0" width="4" height="4" fill="#00ff41"/>
    <rect x="136" y="0" width="4" height="4" fill="#facc15"/>
    <rect x="76" y="0" width="4" height="4" fill="#38bdf8"/>
    <rect x="42" y="0" width="4" height="4" fill="#f43f5e"/>
    <rect x="110" y="0" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="confetti-2">
    <rect x="28" y="0" width="4" height="4" fill="#39ff14"/>
    <rect x="146" y="0" width="4" height="4" fill="#00ffaa"/>
    <rect x="90" y="0" width="4" height="4" fill="#facc15"/>
    <rect x="60" y="0" width="4" height="4" fill="#c084fc"/>
  </g>

  <ellipse cx="80" cy="144" rx="28" ry="5" fill="#00ff41" opacity="0.3"/>

  <!-- Mascot Body (Centered at 80, 100) -->
  <g class="mascot-win">
    <rect x="56" y="80" width="48" height="12" fill="#00ff41"/><rect x="60" y="78" width="40" height="16" fill="#00ff41"/><rect x="52" y="82" width="56" height="8" fill="#00ff41"/>
    <rect x="62" y="92" width="14" height="28" fill="#00ff41"/><rect x="60" y="118" width="18" height="8" fill="#00ff41"/>
    <rect x="84" y="92" width="14" height="26" fill="#00ff41"/><rect x="84" y="116" width="20" height="10" fill="#00ff41"/><rect x="98" y="110" width="8" height="12" fill="#00ff41"/>
    <rect x="64" y="94" width="10" height="24" fill="#000000"/><rect x="66" y="94" width="7" height="24" fill="#00ff41"/><rect x="66" y="94" width="2" height="24" fill="#ffffff"/>
    <rect x="62" y="120" width="14" height="4" fill="#000000"/><rect x="64" y="120" width="10" height="3" fill="#00ff41"/>
    <rect x="86" y="94" width="10" height="22" fill="#000000"/><rect x="88" y="94" width="7" height="22" fill="#00ff41"/><rect x="88" y="94" width="2" height="22" fill="#ffffff"/>
    <rect x="86" y="118" width="16" height="6" fill="#000000"/><rect x="88" y="118" width="13" height="4" fill="#00ff41"/><rect x="100" y="112" width="4" height="8" fill="#000000"/><rect x="101" y="113" width="3" height="5" fill="#00ff41"/>
    <rect x="58" y="80" width="44" height="12" fill="#000000"/><rect x="60" y="80" width="40" height="12" fill="#00ff41"/><rect x="60" y="78" width="40" height="2" fill="#ffffff"/><rect x="58" y="91" width="44" height="1" fill="#000000"/>
    <rect x="62" y="82" width="36" height="8" fill="#000000"/>

    <rect x="62" y="82" width="16" height="6" fill="#000000"/><rect x="78" y="82" width="4" height="2" fill="#00ff41"/><rect x="82" y="82" width="16" height="6" fill="#000000"/><rect x="64" y="88" width="12" height="2" fill="#000000"/><rect x="84" y="88" width="12" height="2" fill="#000000"/>
    <rect x="64" y="84" width="12" height="4" fill="#001804"/><rect x="84" y="84" width="12" height="4" fill="#001804"/>
    <g class="gleam" fill="#ffffff"><rect x="66" y="84" width="4" height="2"/><rect x="86" y="84" width="4" height="2"/></g>
    <g fill="#00ff41"><rect x="98" y="86" width="6" height="6"/><rect x="102" y="82" width="4" height="4"/><rect x="104" y="82" width="2" height="2" fill="#ffffff"/></g>
  </g>
</svg>
