"96" cy="86" r="1.65" fill="#8b5cf6"/> <circle cx="88" cy="90" r="1.65" fill="#8b5cf6"/> <circle cx="92" cy="90" r="1.65" fill="#8b5cf6"/> <circle cx="96" cy="90" r="1.65" fill="#8b5cf6"/> <circle cx="88" cy="94" r="1.65" fill="#3b82f6"/> <circle cx="92" cy="94" r="1.65" fill="#3b82f6"/> <circle cx="96" cy="94" r="1.65" fill="#3b82f6"/> <circle cx="88" cy="98" r="1.65" fill="#3b82f6"/> <circle cx="92" cy="98" r="1.65" fill="#3b82f6"/> <circle cx="96" cy="98" r="1.65" fill="#3b82f6"/> <circle cx="88" cy="102" r="1.65" fill="#06b6d4"/> <circle cx="92" cy="102" r="1.65" fill="#06b6d4"/> <circle cx="96" cy="102" r="1.65" fill="#06b6d4"/> <circle cx="88" cy="106" r="1.65" fill="#06b6d4"/> <circle cx="92" cy="106" r="1.65" fill="#06b6d4"/> <circle cx="96" cy="106" r="1.65" fill="#06b6d4"/> <circle cx="88" cy="110" r="1.65" fill="#00f0ff"/> <circle cx="92" cy="110" r="1.65" fill="#00f0ff"/> <circle cx="96" cy="110" r="1.65" fill="#00f0ff"/> <circle cx="100" cy="110" r="1.65" fill="#00f0ff"/> <circle cx="92" cy="114" r="1.65" fill="#00f0ff"/> <circle cx="96" cy="114" r="1.65" fill="#00f0ff"/> <circle cx="100" cy="114" r="1.65" fill="#00f0ff"/> <circle cx="104" cy="114" r="1.65" fill="#00f0ff"/> <circle cx="96" cy="118" r="1.65" fill="#00f0ff"/> <circle cx="100" cy="118" r="1.65" fill="#00f0ff"/> <circle cx="104" cy="118" r="1.65" fill="#00f0ff"/>
  </g>
