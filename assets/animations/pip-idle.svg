<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <!-- Halftone Dither Pattern for Left Leg Bottom Block -->
    <pattern id="piHalftone" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#180b2c"/>
      <rect x="0" y="0" width="1" height="1" fill="#c084fc"/>
      <rect x="2" y="2" width="1" height="1" fill="#c084fc"/>
    </pattern>
  </defs>

  <style>
    @keyframes pixelBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pixelBlink {
      0%, 42%, 58%, 100% { opacity: 1; }
      45%, 55% { opacity: 0; }
    }
    @keyframes pixelBlinkClosed {
      0%, 42%, 58%, 100% { opacity: 0; }
      45%, 55% { opacity: 1; }
    }
    @keyframes zClimb1 {
      0% { opacity: 0; transform: translate(0, 0); }
      30% { opacity: 1; }
      80% { opacity: 1; transform: translate(8px, -60px); }
      100% { opacity: 0; transform: translate(14px, -85px); }
    }
    @keyframes zClimb2 {
      0% { opacity: 0; transform: translate(0, 0); }
      30% { opacity: 1; }
      80% { opacity: 1; transform: translate(10px, -60px); }
      100% { opacity: 0; transform: translate(18px, -85px); }
    }

    .mascot-idle { animation: pixelBreathe 2.4s steps(2) infinite; transform-origin: 80px 100px; }
    .eye-open { animation: pixelBlink 4s steps(1) infinite; }
    .eye-closed { animation: pixelBlinkClosed 4s steps(1) infinite; }
    .z-1 { animation: zClimb1 3s steps(6) infinite; }
    .z-2 { animation: zClimb2 3s steps(6) infinite 1.5s; }
  </style>

  <!-- Pure Black Background -->
  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">IDLE</text>
  </g>

  <!-- Rising Sleepy ZZZ Particles in Pink/Cyan -->
  <g class="z-1" fill="#f43f5e" transform="translate(108, 75)">
    <path d="M0,0 H6 L2,6 H6 V8 H0 L4,2 H0 Z"/>
    <path d="M8,-12 H15 L10,-4 H15 V-2 H8 L13,-10 H8 Z"/>
    <path d="M18,-26 H27 L20,-16 H27 V-13 H18 L25,-23 H18 Z"/>
  </g>
  <g class="z-2" fill="#00f0ff" transform="translate(116, 85)">
    <path d="M0,0 H6 L2,6 H6 V8 H0 L4,2 H0 Z"/>
    <path d="M8,-14 H16 L11,-5 H16 V-3 H8 L13,-12 H8 Z"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#f43f5e" opacity="0.25"/>
  <ellipse cx="80" cy="180" rx="20" ry="2.5" fill="#00f0ff" opacity="0.6"/>

  <!-- Official Oh My Pi (OMP) Pixel-Grid Pi Logo Mascot -->
  <g class="mascot-idle">
    <!-- Top Horizontal Crossbar (7 Block Modules, Pink -> Violet -> Cyan) -->
    <!-- Block 1: Hot Pink -->
    <rect x="49" y="74" width="9" height="9" fill="#ff4071" stroke="#000" stroke-width="0.75"/>
    <!-- Block 2: Deep Pink (Leg Left Anchor) -->
    <rect x="58" y="74" width="9" height="9" fill="#f43f5e" stroke="#000" stroke-width="0.75"/>
    <!-- Block 3: Magenta/Violet -->
    <rect x="67" y="74" width="9" height="9" fill="#c026d3" stroke="#000" stroke-width="0.75"/>
    <!-- Block 4: Rich Purple (Center) -->
    <rect x="76" y="74" width="9" height="9" fill="#9333ea" stroke="#000" stroke-width="0.75"/>
    <!-- Block 5: Indigo/Periwinkle (Leg Right Anchor) -->
    <rect x="85" y="74" width="9" height="9" fill="#6366f1" stroke="#000" stroke-width="0.75"/>
    <!-- Block 6: Sky Blue -->
    <rect x="94" y="74" width="9" height="9" fill="#0ea5e9" stroke="#000" stroke-width="0.75"/>
    <!-- Block 7: Electric Cyan -->
    <rect x="103" y="74" width="9" height="9" fill="#00f0ff" stroke="#000" stroke-width="0.75"/>

    <!-- Left Leg (4 Blocks Dropping from Block 2) -->
    <!-- Leg Block L1: Magenta -->
    <rect x="58" y="83" width="9" height="9" fill="#ec4899" stroke="#000" stroke-width="0.75"/>
    <!-- Leg Block L2: Violet -->
    <rect x="58" y="92" width="9" height="9" fill="#a855f7" stroke="#000" stroke-width="0.75"/>
    <!-- Leg Block L3: Deep Purple -->
    <rect x="58" y="101" width="9" height="9" fill="#7e22ce" stroke="#000" stroke-width="0.75"/>
    <!-- Leg Block L4: Halftone Dithered Foot -->
    <rect x="58" y="110" width="9" height="9" fill="url(#piHalftone)" stroke="#000" stroke-width="0.75"/>

    <!-- Right Leg (4 Blocks Dropping from Block 5) -->
    <!-- Leg Block R1: Indigo -->
    <rect x="85" y="83" width="9" height="9" fill="#7c3aed" stroke="#000" stroke-width="0.75"/>
    <!-- Leg Block R2: Blue -->
    <rect x="85" y="92" width="9" height="9" fill="#2563eb" stroke="#000" stroke-width="0.75"/>
    <!-- Leg Block R3: Sky Blue -->
    <rect x="85" y="101" width="9" height="9" fill="#0284c7" stroke="#000" stroke-width="0.75"/>
    <!-- Leg Block R4: Luminous Cyan Foot -->
    <rect x="85" y="110" width="9" height="9" fill="#00f0ff" stroke="#000" stroke-width="0.75"/>

    <!-- Subtle Robot Pixel Eyes (Integrated into Center Pi Crossbar) -->
    <g class="eye-closed">
      <rect x="71" y="78" width="4" height="2" fill="#ffffff"/>
      <rect x="88" y="78" width="4" height="2" fill="#ffffff"/>
    </g>
    <g class="eye-open">
      <rect x="71" y="76" width="4" height="4" fill="#ffffff"/>
      <rect x="72" y="77" width="2" height="2" fill="#000000"/>
      <rect x="88" y="76" width="4" height="4" fill="#ffffff"/>
      <rect x="89" y="77" width="2" height="2" fill="#000000"/>
    </g>
  </g>
</svg>
