<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    @keyframes pixelBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pixelBlink {
      0%, 42%, 58%, 100% { opacity: 1; }
      45%, 55% { opacity: 0; }
    }
    @keyframes pixelBlinkClosed {
      0%, 42%, 58%, 100% { opacity: 0; }
      45%, 55% { opacity: 1; }
    }
    @keyframes zClimb1 {
      0% { opacity: 0; transform: translate(0, 0); }
      30% { opacity: 1; }
      80% { opacity: 1; transform: translate(8px, -40px); }
      100% { opacity: 0; transform: translate(12px, -60px); }
    }
    @keyframes zClimb2 {
      0% { opacity: 0; transform: translate(0, 0); }
      30% { opacity: 1; }
      80% { opacity: 1; transform: translate(10px, -40px); }
      100% { opacity: 0; transform: translate(16px, -60px); }
    }

    .mascot-idle { animation: pixelBreathe 2.4s steps(2) infinite; transform-origin: 80px 100px; }
    .eye-open { animation: pixelBlink 4s steps(1) infinite; }
    .eye-closed { animation: pixelBlinkClosed 4s steps(1) infinite; }
    .z-1 { animation: zClimb1 3s steps(6) infinite; }
    .z-2 { animation: zClimb2 3s steps(6) infinite 1.5s; }
  </style>

  <!-- Pure Black Background -->
  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="25" x2="160" y2="25"/>
    <line x1="0" y1="50" x2="160" y2="50"/>
    <line x1="0" y1="150" x2="160" y2="150"/>
    <line x1="0" y1="175" x2="160" y2="175"/>
    <line x1="25" y1="0" x2="25" y2="200"/>
    <line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/>
    <path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/>
    <path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Rising Sleepy ZZZ Particles to the Ceiling -->
  <g class="z-1" fill="#00ff41">
    <g transform="translate(100, 70)">
      <rect x="0" y="0" width="8" height="2"/>
      <rect x="3" y="2" width="2" height="2"/>
      <rect x="0" y="4" width="8" height="2"/>
    </g>
  </g>
  <g class="z-2" fill="#39ff14">
    <g transform="translate(110, 60)">
      <rect x="0" y="0" width="6" height="2"/>
      <rect x="2" y="2" width="2" height="2"/>
      <rect x="0" y="4" width="6" height="2"/>
    </g>
  </g>

  <!-- Ground Levitation Shadow -->
  <ellipse cx="80" cy="144" rx="28" ry="5" fill="#00ff41" opacity="0.25"/>
  <ellipse cx="80" cy="144" rx="16" ry="2.5" fill="#00ff41" opacity="0.6"/>

  <!-- Mascot Body (Centered at 80, 100) -->
  <g class="mascot-idle">
    <!-- Outlines -->
    <rect x="56" y="80" width="48" height="12" fill="#00ff41"/>
    <rect x="60" y="78" width="40" height="16" fill="#00ff41"/>
    <rect x="52" y="82" width="56" height="8" fill="#00ff41"/>

    <rect x="62" y="92" width="14" height="28" fill="#00ff41"/>
    <rect x="60" y="118" width="18" height="8" fill="#00ff41"/>

    <rect x="84" y="92" width="14" height="26" fill="#00ff41"/>
    <rect x="84" y="116" width="20" height="10" fill="#00ff41"/>
    <rect x="98" y="110" width="8" height="12" fill="#00ff41"/>

    <!-- Left Leg Black Separation & Solid Green Fill -->
    <rect x="64" y="94" width="10" height="24" fill="#000000"/>
    <rect x="66" y="94" width="7" height="24" fill="#00ff41"/>
    <rect x="66" y="94" width="2" height="24" fill="#ffffff"/>
    <rect x="62" y="120" width="14" height="4" fill="#000000"/>
    <rect x="64" y="120" width="10" height="3" fill="#00ff41"/>

    <!-- Right Leg Black Separation & Solid Green Fill -->
    <rect x="86" y="94" width="10" height="22" fill="#000000"/>
    <rect x="88" y="94" width="7" height="22" fill="#00ff41"/>
    <rect x="88" y="94" width="2" height="22" fill="#ffffff"/>
    <!-- Right Leg Signature Pi-Curl Kickstand -->
    <rect x="86" y="118" width="16" height="6" fill="#000000"/>
    <rect x="88" y="118" width="13" height="4" fill="#00ff41"/>
    <rect x="100" y="112" width="4" height="8" fill="#000000"/>
    <rect x="101" y="113" width="3" height="5" fill="#00ff41"/>

    <!-- Head / Crossbar Black Separation & Fill -->
    <rect x="58" y="80" width="44" height="12" fill="#000000"/>
    <rect x="60" y="80" width="40" height="12" fill="#00ff41"/>
    <rect x="60" y="78" width="40" height="2" fill="#ffffff"/>
    <rect x="58" y="91" width="44" height="1" fill="#000000"/>

    <!-- OLED Visor -->
    <rect x="62" y="82" width="36" height="8" fill="#000000"/>

    <!-- Eyes (Open vs Sleeping Slits) -->
    <g class="eye-open" fill="#00ff41">
      <rect x="68" y="84" width="5" height="4"/>
      <rect x="70" y="84" width="2" height="2" fill="#ffffff"/>

      <rect x="88" y="84" width="5" height="4"/>
      <rect x="90" y="84" width="2" height="2" fill="#ffffff"/>
    </g>
    <g class="eye-closed" fill="#00ff41">
      <rect x="68" y="86" width="6" height="2"/>
      <rect x="88" y="86" width="6" height="2"/>
    </g>

    <!-- Matrix Code Cheeks -->
    <rect x="64" y="88" width="4" height="2" fill="#00ffaa" opacity="0.8"/>
    <rect x="94" y="88" width="4" height="2" fill="#00ffaa" opacity="0.8"/>
  </g>
</svg>
