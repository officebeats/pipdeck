<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" preserveAspectRatio="none" shape-rendering="crispEdges">
  <style>
    @keyframes pixelBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pixelBlink {
      0%, 42%, 58%, 100% { opacity: 1; }
      45%, 55% { opacity: 0; }
    }
    @keyframes pixelBlinkClosed {
      0%, 42%, 58%, 100% { opacity: 0; }
      45%, 55% { opacity: 1; }
    }
    @keyframes zClimb1 {
      0% { opacity: 0; transform: translate(0, 0); }
      30% { opacity: 1; }
      80% { opacity: 1; transform: translate(8px, -60px); }
      100% { opacity: 0; transform: translate(14px, -85px); }
    }
    @keyframes zClimb2 {
      0% { opacity: 0; transform: translate(0, 0); }
      30% { opacity: 1; }
      80% { opacity: 1; transform: translate(10px, -60px); }
      100% { opacity: 0; transform: translate(18px, -85px); }
    }

    .mascot-idle { animation: pixelBreathe 2.4s steps(2) infinite; transform-origin: 80px 100px; }
    .eye-open { animation: pixelBlink 4s steps(1) infinite; }
    .eye-closed { animation: pixelBlinkClosed 4s steps(1) infinite; }
    .z-1 { animation: zClimb1 3s steps(6) infinite; }
    .z-2 { animation: zClimb2 3s steps(6) infinite 1.5s; }
  </style>

  <!-- Pure Black Background -->
  <rect width="160" height="200" fill="#000000"/>

  <!-- Matrix Grid Texture -->
  <g stroke="#003b00" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="15" x2="160" y2="15"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="155" x2="160" y2="155"/><line x1="0" y1="185" x2="160" y2="185"/>
    <line x1="25" y1="0" x2="25" y2="200"/><line x1="135" y1="0" x2="135" y2="200"/>
  </g>

  <!-- Corner Reticles -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none">
    <path d="M2,12 L2,2 L12,2"/><path d="M158,12 L158,2 L148,2"/>
    <path d="M2,188 L2,198 L12,198"/><path d="M158,188 L158,198 L148,198"/>
  </g>

  <!-- Top-Right Combo HUD Badge -->
  <g transform="translate(94, 6)">
    <rect width="62" height="16" fill="#000000" stroke="#00ff41" stroke-width="1.5"/>
    <text x="31" y="11.5" font-family="'Fira Code', monospace" font-size="7.5" font-weight="900" fill="#00ff41" text-anchor="middle">IDLE</text>
  </g>

  <!-- Rising Sleepy ZZZ Particles -->
  <g class="z-1" fill="#7443fa" transform="translate(100, 75)">
    <path d="M0,0 H6 L2,6 H6 V8 H0 L4,2 H0 Z"/>
    <path d="M8,-12 H15 L10,-4 H15 V-2 H8 L13,-10 H8 Z"/>
    <path d="M18,-26 H27 L20,-16 H27 V-13 H18 L25,-23 H18 Z"/>
  </g>
  <g class="z-2" fill="#22d3ee" transform="translate(108, 85)">
    <path d="M0,0 H6 L2,6 H6 V8 H0 L4,2 H0 Z"/>
    <path d="M8,-14 H16 L11,-5 H16 V-3 H8 L13,-12 H8 Z"/>
  </g>

  <!-- Ground Levitation Floor -->
  <g opacity="0.6" stroke="#7443fa" stroke-width="1">
    <line x1="20" y1="184" x2="140" y2="184" stroke-dasharray="4,2"/>
    <line x1="35" y1="188" x2="125" y2="188"/>
  </g>
  <ellipse cx="80" cy="180" rx="36" ry="5" fill="#7443fa" opacity="0.25"/>
  <ellipse cx="80" cy="180" rx="20" ry="2.5" fill="#22d3ee" opacity="0.6"/>

  <!-- Mascot Body (Authentic OMP Purple #7443fa & Neon Cyan #22d3ee Palette) -->
  <g class="mascot-idle">
    <!-- Pi Crown / Head Top -->
    <rect x="64" y="84" width="32" height="10" fill="#7443fa"/>
    <rect x="66" y="82" width="28" height="14" fill="#7443fa"/>
    <rect x="62" y="86" width="36" height="6" fill="#7443fa"/>
    
    <!-- Left Leg -->
    <rect x="68" y="94" width="10" height="22" fill="#6437e3"/>
    <rect x="66" y="114" width="14" height="6" fill="#7443fa"/>
    <!-- Right Leg & Foot Curl -->
    <rect x="82" y="94" width="10" height="20" fill="#6437e3"/>
    <rect x="82" y="112" width="16" height="8" fill="#7443fa"/>
    <rect x="94" y="106" width="6" height="10" fill="#8b5cf6"/>

    <!-- Core Highlights & Accents -->
    <rect x="70" y="96" width="6" height="18" fill="#000000"/>
    <rect x="71" y="96" width="5" height="18" fill="#7443fa"/>
    <rect x="71" y="96" width="2" height="18" fill="#ffffff"/>
    <rect x="68" y="116" width="10" height="2" fill="#000000"/>
    <rect x="69" y="116" width="8" height="2" fill="#22d3ee"/>

    <rect x="84" y="96" width="6" height="16" fill="#000000"/>
    <rect x="85" y="96" width="5" height="16" fill="#7443fa"/>
    <rect x="85" y="96" width="2" height="16" fill="#ffffff"/>
    <rect x="84" y="114" width="12" height="4" fill="#000000"/>
    <rect x="85" y="114" width="10" height="3" fill="#22d3ee"/>
    <rect x="96" y="108" width="3" height="6" fill="#000000"/>
    <rect x="96" y="109" width="2" height="4" fill="#8b5cf6"/>

    <!-- Face Screen -->
    <rect x="66" y="84" width="28" height="10" fill="#0f0f0f"/>
    <rect x="67" y="84" width="26" height="10" fill="#7443fa"/>
    <rect x="67" y="82" width="26" height="2" fill="#ffffff"/>
    <rect x="66" y="93" width="28" height="1" fill="#000000"/>
    <rect x="69" y="85" width="22" height="7" fill="#0f0f0f"/>

    <!-- Eyes (Sleeping Slits in Neon Cyan #22d3ee) -->
    <g class="eye-closed">
      <rect x="72" y="88" width="5" height="2" fill="#22d3ee"/>
      <rect x="83" y="88" width="5" height="2" fill="#22d3ee"/>
    </g>
    <!-- Eyes (Occasional Open Blink with White Glint) -->
    <g class="eye-open">
      <rect x="72" y="86" width="5" height="4" fill="#22d3ee"/>
      <rect x="73" y="86" width="2" height="2" fill="#ffffff"/>
      <rect x="83" y="86" width="5" height="4" fill="#22d3ee"/>
      <rect x="84" y="86" width="2" height="2" fill="#ffffff"/>
    </g>

    <!-- Ear Sensors -->
    <g fill="#7443fa">
      <rect x="58" y="86" width="4" height="6"/>
      <rect x="59" y="87" width="2" height="4" fill="#22d3ee"/>
      <rect x="98" y="86" width="4" height="6"/>
      <rect x="99" y="87" width="2" height="4" fill="#22d3ee"/>
    </g>
  </g>
</svg>
